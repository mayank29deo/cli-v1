<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VED AI — Booster CSV Upload + Auto-Assign</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060C18;--panel:#0B1525;--card:#0F1D30;--border:#162438;
  --purple:#8B7CF8;--teal:#1ECDB5;--green:#2ECC9A;--amber:#F5BC1E;
  --red:#F06060;--blue:#5BA8FF;--pink:#E06EAA;--orange:#FF7A2E;
  --text:#C8DCF0;--muted:#4A6580;--faint:#0E1B2C;
}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes sparkle{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:52px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--border)}
.logo{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.35em;color:var(--purple)}
.divider{width:1px;height:20px;background:var(--border)}
.crumb{font-size:11.5px;font-weight:500}
.crumb span{color:var(--muted)}
.nav-links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-btn{font-size:11px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);color:var(--muted);transition:all .15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--purple);color:var(--purple)}
.nav-btn.on{border-color:var(--purple);color:var(--purple);background:rgba(139,124,248,.07)}

.wrap{max-width:1520px;margin:0 auto;padding:22px 28px 60px}
h1.pg-title{font-size:26px;font-weight:300;letter-spacing:-.01em;margin-bottom:3px}
.pg-sub{font-size:12px;color:var(--muted);margin-bottom:22px}

.dropzone{background:var(--card);border:2px dashed var(--border);border-radius:14px;padding:40px 28px;text-align:center;transition:all .2s;cursor:pointer;margin-bottom:22px;animation:up .4s ease}
.dropzone:hover{border-color:var(--purple);background:rgba(139,124,248,.03)}
.dropzone.drag{border-color:var(--purple);background:rgba(139,124,248,.08)}
.dz-icon{font-size:36px;margin-bottom:10px}
.dz-title{font-size:16px;font-weight:500;margin-bottom:5px}
.dz-sub{font-size:11.5px;color:var(--muted);line-height:1.65}
.dz-sub code{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--amber);background:var(--faint);padding:1px 6px;border-radius:3px}
.dz-hint{font-size:10.5px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);line-height:1.6}
.file-picker{display:none}

.schema-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:22px;animation:up .4s ease .05s both}
.schema-title{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.schema-section{margin-top:12px}
.schema-section-label{font-size:10px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.schema-section-label .badge{font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.05em}
.schema-section-label .badge.req{background:rgba(240,96,96,.1);color:var(--red);border:1px solid rgba(240,96,96,.25)}
.schema-section-label .badge.cond{background:rgba(245,188,30,.1);color:var(--amber);border:1px solid rgba(245,188,30,.25)}
.schema-section-label .badge.opt{background:rgba(74,101,128,.15);color:var(--muted);border:1px solid var(--border)}
.schema-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;font-family:'DM Mono',monospace;font-size:10.5px}
.schema-col{color:var(--text);background:var(--faint);padding:5px 9px;border-radius:5px;border:1px solid var(--border)}
.schema-demo{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);display:flex;gap:6px;align-items:center}
.schema-demo button{font-size:10.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);color:var(--purple)}
.schema-demo button:hover{background:rgba(139,124,248,.08)}

.results-section{display:none;animation:up .5s ease both}
.results-section.on{display:block}
.stats-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.stat-label{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.stat-val{font-size:22px;font-weight:500;font-family:'DM Mono',monospace;line-height:1}
.stat-sub{font-size:10px;color:var(--muted);margin-top:5px}

.result-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill-chip{font-size:11.5px;padding:5px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace}
.rbar-btn{font-size:11.5px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);color:var(--text);font-weight:500;transition:all .15s}
.rbar-btn:hover{border-color:var(--purple);color:var(--purple)}
.rbar-btn.download{border-color:var(--green);color:var(--green);background:rgba(46,204,154,.06)}
.rbar-btn.download:hover{background:rgba(46,204,154,.14)}
.rbar-btn.ai{border-color:var(--orange);color:var(--orange);background:linear-gradient(135deg,rgba(255,122,46,.05),rgba(245,188,30,.05));display:inline-flex;align-items:center;gap:7px}
.rbar-btn.ai:hover{background:linear-gradient(135deg,rgba(255,122,46,.14),rgba(245,188,30,.14))}
.rbar-btn.ai .sparkle{animation:sparkle 1.8s ease-in-out infinite;display:inline-block}
.rbar-btn.reset{margin-left:auto;color:var(--muted)}
.rbar-btn:disabled{opacity:.5;cursor:not-allowed}

.ai-card{background:linear-gradient(135deg,rgba(255,122,46,.04),rgba(245,188,30,.03),rgba(139,124,248,.03));border:1px solid rgba(255,122,46,.25);border-radius:14px;padding:22px 24px;margin-bottom:22px;animation:up .4s ease}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ai-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.ai-sparkle{font-size:18px;animation:sparkle 1.8s ease-in-out infinite}
.ai-model{margin-left:auto;font-size:9.5px;color:var(--muted);font-family:'DM Mono',monospace;padding:3px 9px;border-radius:20px;border:1px solid var(--border)}
.ai-body{font-size:13px;line-height:1.85;white-space:pre-wrap;color:var(--text)}
.ai-body strong{color:var(--orange);font-weight:600}
.ai-footer{margin-top:14px;padding-top:14px;border-top:1px dashed rgba(255,122,46,.2);font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;display:flex;flex-wrap:wrap;gap:14px}

.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-wrap{max-height:560px;overflow:auto}
.leads-table{width:100%;border-collapse:collapse}
.leads-table th{text-align:left;padding:10px 11px;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:2;white-space:nowrap}
.leads-table td{padding:10px 11px;border-bottom:1px solid var(--faint);font-size:11.5px;vertical-align:middle}
.leads-table tr:hover td{background:rgba(139,124,248,.025)}
.sn-name{font-weight:500}
.sn-meta{font-size:9.5px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.reg-pill{font-size:9.5px;padding:2px 8px;border-radius:20px;background:var(--faint);color:var(--muted);border:1px solid var(--border);font-family:'DM Mono',monospace}
.grade-pill{font-size:9.5px;padding:2px 8px;border-radius:20px;background:var(--faint);color:var(--purple);border:1px solid rgba(139,124,248,.25);font-weight:600}
.aud-pill{font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:4px}
.aud-pill.parent{background:rgba(255,122,46,.1);color:var(--orange);border:1px solid rgba(255,122,46,.25)}
.aud-pill.student{background:rgba(94,168,255,.1);color:var(--blue);border:1px solid rgba(94,168,255,.25)}
.metric-bit{font-size:10.5px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:4px;background:var(--faint);border:1px solid var(--border);display:inline-block;margin-right:3px}
.metric-bit.good{color:var(--green);border-color:rgba(46,204,154,.3);background:rgba(46,204,154,.06)}
.metric-bit.bad{color:var(--red);border-color:rgba(240,96,96,.3);background:rgba(240,96,96,.06)}
.score-cell{font-family:'DM Mono',monospace;font-size:13.5px;font-weight:500;text-align:center}
.tier-pill{font-size:9.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chosen-tpl{font-size:9.5px;font-family:'DM Mono',monospace;color:var(--amber);background:rgba(245,188,30,.08);padding:2px 7px;border-radius:4px;border:1px solid rgba(245,188,30,.2);display:inline-block;white-space:nowrap}
.reason-cell{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;max-width:240px;line-height:1.45}

.status-box{padding:14px 18px;border-radius:10px;margin-bottom:16px;font-size:12px;line-height:1.55;animation:slideIn .25s ease}
.status-box.error{background:rgba(240,96,96,.08);border:1px solid rgba(240,96,96,.3);color:var(--red)}
.status-box.ok{background:rgba(46,204,154,.06);border:1px solid rgba(46,204,154,.25);color:var(--green)}
.status-box.warn{background:rgba(245,188,30,.06);border:1px solid rgba(245,188,30,.25);color:var(--amber)}
.status-box.loading{background:rgba(139,124,248,.07);border:1px solid rgba(139,124,248,.28);color:var(--purple);display:flex;align-items:center;gap:10px}
.status-box.loading::before{content:"";width:14px;height:14px;border:2px solid var(--purple);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1100px){
  .stats-strip{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:700px){
  .stats-strip{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:14px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ═══════════════════════════════════════════════════════
   BOOSTER CSV — local algorithm, audience-aware, 6-dim score
═══════════════════════════════════════════════════════ */

const TIER = {
  hot:    {label:"Hot",      color:"#F06060"},
  warm75: {label:"Warm-75",  color:"#FF7A2E"},
  warm50: {label:"Warm-50",  color:"#F5BC1E"},
  d1ns:   {label:"D1 NoShow",color:"#4A6580"},
};

// 6-dimensional scoring (per Vedantu sheet schema: test ≠ HW)
const WEIGHTS = {
  attendance:      0.25,
  test:            0.20,
  hw:              0.20,
  class_engage:    0.15,
  product_engage:  0.15,
  wa_read:         0.05,
};

const REQUIRED = [
  "first_name","last_name","phone","email","region","grade",
  "d1_attended","d2_attended","d3_attended",
  "test_d1_submitted","test_d2_submitted","test_d3_submitted",
  "hw_d1_submitted","hw_d2_submitted","hw_d3_submitted",
];
const CONDITIONAL_PARENT = [
  "parent_first_name","parent_last_name","parent_phone",
];
const OPTIONAL = [
  "class","batch_id",
  "class_engagement_d1","class_engagement_d2","class_engagement_d3",
  "doubts_posted","replay_sessions","engagement_score_app","device",
  "watch_time_d1","watch_time_d2","watch_time_d3",
  "wa_msgs_sent","wa_msgs_read",
];

/* ═══════════════════════════════════════════════════════
   AUDIENCE + TEMPLATE RESOLUTION (mirrors apps_script + templates.html)
═══════════════════════════════════════════════════════ */

function getAudience(grade) {
  if (grade >= 5 && grade <= 7) return "parent";
  return "student";
}

function pickLogicalTemplate(s) {
  if (!s.d1_attended && !s.d2_attended && !s.d3_attended) return {id:"T16_D1_NOSHOW", phase:"d1ns"};
  if (s.d1_attended && s.d2_attended && s.d3_attended)    return {id:"T14_COUNSELLOR_CONNECT", phase:"hot_handoff"};
  if (s.d1_attended && s.d2_attended && !s.d3_attended)   return {id:"T14_COUNSELLOR_CONNECT", phase:"warm75"};
  if (s.d1_attended && !s.d2_attended)                    return {id:"T15_NURTURE_SOFT", phase:"warm50"};
  return {id:"T13_INTENT_CAPTURE", phase:"intent"};
}

function resolveWatiId(logicalId, audience) {
  // Shared templates have no audience suffix
  const SHARED = ["T02_REMINDER_T24H","T03_REMINDER_T3H","T04_JOIN_NOW","T06_HW_ASSIGNED","T07_HW_REMINDER"];
  if (SHARED.includes(logicalId)) return logicalId;
  return `${logicalId}_${audience.toUpperCase()}`;
}

function pickTemplate(s) {
  const {id: logical} = pickLogicalTemplate(s);
  return resolveWatiId(logical, s.audience);
}

/* ═══════════════════════════════════════════════════════
   SCORING — 6 dimensions, normalized for missing fields
═══════════════════════════════════════════════════════ */

function avgBool(...arr) {
  if (arr.length === 0) return 0;
  return arr.filter(Boolean).length / arr.length;
}

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function computeScore(s) {
  // Tier 1 — always available
  const attn = avgBool(s.d1_attended, s.d2_attended, s.d3_attended);
  const test = avgBool(s.test_d1_submitted, s.test_d2_submitted, s.test_d3_submitted);
  const hw   = avgBool(s.hw_d1_submitted, s.hw_d2_submitted, s.hw_d3_submitted);

  // Tier 2 — optional, normalized to 0-1
  const hasClassEng = s.class_engagement_d1 != null || s.class_engagement_d2 != null || s.class_engagement_d3 != null;
  const classEng = hasClassEng ? clamp01(((+s.class_engagement_d1 || 0) + (+s.class_engagement_d2 || 0) + (+s.class_engagement_d3 || 0)) / 300) : null;

  const hasProductEng = s.engagement_score_app != null || s.doubts_posted != null || s.replay_sessions != null;
  let productEng = null;
  if (hasProductEng) {
    if (s.engagement_score_app != null) {
      productEng = clamp01((+s.engagement_score_app) / 100);
    } else {
      // Proxy from doubts + replays (rough heuristic)
      const proxy = (+s.doubts_posted || 0) * 5 + (+s.replay_sessions || 0) * 3;
      productEng = clamp01(proxy / 50);  // 50pts saturates
    }
  }

  const hasWa = s.wa_msgs_sent > 0;
  const waRead = hasWa ? clamp01(s.wa_msgs_read / s.wa_msgs_sent) : null;

  // Compute weighted score, redistributing weights for missing optional fields
  const dims = [
    {w: WEIGHTS.attendance,     v: attn,      present: true},
    {w: WEIGHTS.test,           v: test,      present: true},
    {w: WEIGHTS.hw,             v: hw,        present: true},
    {w: WEIGHTS.class_engage,   v: classEng,  present: hasClassEng},
    {w: WEIGHTS.product_engage, v: productEng,present: hasProductEng},
    {w: WEIGHTS.wa_read,        v: waRead,    present: hasWa},
  ];
  const present = dims.filter(d => d.present);
  const totalW = present.reduce((a, d) => a + d.w, 0);
  const score = present.reduce((acc, d) => acc + (d.w / totalW) * d.v, 0);

  return {
    score: +score.toFixed(4),
    attn_pct: Math.round(attn * 100),
    test_pct: Math.round(test * 100),
    hw_pct: Math.round(hw * 100),
    class_eng_pct: hasClassEng ? Math.round(classEng * 100) : null,
    product_eng_pct: hasProductEng ? Math.round(productEng * 100) : null,
    wa_read_pct: hasWa ? Math.round(waRead * 100) : null,
  };
}

function assignTier(s) {
  if (!s.d1_attended && !s.d2_attended && !s.d3_attended) return "d1ns";
  if (s.score >= 0.80) return "hot";
  if (s.score >= 0.55) return "warm75";
  if (s.score >= 0.30) return "warm50";
  return "d1ns";
}

function reasonFor(s) {
  const attnN = (s.d1_attended?1:0) + (s.d2_attended?1:0) + (s.d3_attended?1:0);
  const testN = (s.test_d1_submitted?1:0) + (s.test_d2_submitted?1:0) + (s.test_d3_submitted?1:0);
  const hwN = (s.hw_d1_submitted?1:0) + (s.hw_d2_submitted?1:0) + (s.hw_d3_submitted?1:0);
  const tail = [`${attnN}/3 attn`, `${testN}/3 test`, `${hwN}/3 HW`];
  if (s.class_eng_pct != null) tail.push(`${s.class_eng_pct}% engage`);
  if (s.tier === "hot")    return `Full cohort · ${tail.join(" · ")}`;
  if (s.tier === "warm75") return `D3 dropoff · ${tail.join(" · ")}`;
  if (s.tier === "warm50") return `D2 dropoff · ${tail.join(" · ")}`;
  return `Did not attend any class · score ${s.score.toFixed(2)}`;
}

/* ═══════════════════════════════════════════════════════
   ROW PROCESSING
═══════════════════════════════════════════════════════ */

function parseBool(v) {
  if (v === true) return true;
  if (typeof v === "number") return v === 1;
  if (typeof v === "string") {
    const t = v.trim().toLowerCase();
    return t === "true" || t === "1" || t === "yes" || t === "y" || t === "✓" || t === "present";
  }
  return false;
}

function processRow(raw, idx) {
  const r = {};
  for (const k in raw) {
    const clean = k.trim().toLowerCase().replace(/\s+/g,"_");
    r[clean] = raw[k];
  }

  const s = {
    idx,
    first_name: String(r.first_name || "").trim(),
    last_name: String(r.last_name || "").trim(),
    phone: String(r.phone || "").trim(),
    email: String(r.email || "").trim(),
    region: String(r.region || "").trim().toUpperCase(),
    grade: +r.grade || 0,
    class: String(r.class || "").trim(),
    batch_id: String(r.batch_id || "").trim(),
    parent_first_name: String(r.parent_first_name || "").trim(),
    parent_last_name: String(r.parent_last_name || "").trim(),
    parent_phone: String(r.parent_phone || "").trim(),
    device: String(r.device || "").trim(),

    d1_attended: parseBool(r.d1_attended),
    d2_attended: parseBool(r.d2_attended),
    d3_attended: parseBool(r.d3_attended),

    test_d1_submitted: parseBool(r.test_d1_submitted),
    test_d2_submitted: parseBool(r.test_d2_submitted),
    test_d3_submitted: parseBool(r.test_d3_submitted),

    hw_d1_submitted: parseBool(r.hw_d1_submitted),
    hw_d2_submitted: parseBool(r.hw_d2_submitted),
    hw_d3_submitted: parseBool(r.hw_d3_submitted),

    class_engagement_d1: r.class_engagement_d1 != null && r.class_engagement_d1 !== "" ? +r.class_engagement_d1 : null,
    class_engagement_d2: r.class_engagement_d2 != null && r.class_engagement_d2 !== "" ? +r.class_engagement_d2 : null,
    class_engagement_d3: r.class_engagement_d3 != null && r.class_engagement_d3 !== "" ? +r.class_engagement_d3 : null,
    doubts_posted: r.doubts_posted != null && r.doubts_posted !== "" ? +r.doubts_posted : null,
    replay_sessions: r.replay_sessions != null && r.replay_sessions !== "" ? +r.replay_sessions : null,
    engagement_score_app: r.engagement_score_app != null && r.engagement_score_app !== "" ? +r.engagement_score_app : null,
    watch_time_d1: r.watch_time_d1 != null && r.watch_time_d1 !== "" ? +r.watch_time_d1 : null,
    watch_time_d2: r.watch_time_d2 != null && r.watch_time_d2 !== "" ? +r.watch_time_d2 : null,
    watch_time_d3: r.watch_time_d3 != null && r.watch_time_d3 !== "" ? +r.watch_time_d3 : null,
    wa_msgs_sent: +r.wa_msgs_sent || 0,
    wa_msgs_read: +r.wa_msgs_read || 0,
  };

  s.audience = getAudience(s.grade);

  const computed = computeScore(s);
  Object.assign(s, computed);

  s.tier = assignTier(s);
  s.chosen_template = pickTemplate(s);
  s.handoff_reason = reasonFor(s);

  return s;
}

/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */

let S = {
  students: null,
  fileName: null,
  error: null,
  warnings: [],
  aiInsights: null,
  aiUsage: null,
  aiLoading: false,
  aiError: null,
};

/* ═══════════════════════════════════════════════════════

    aud[s.audience]++;

  return `<div class="results-section on">
    ${rStats(n, tiers, aud, totalScore)}

  </div>`;
}

function rAIInsights() {
  if (S.aiLoading) {
    return `<div class="status-box loading">Calling Claude Opus 4.7 with aggregated cohort stats (no raw rows sent). Typically 3–6 seconds…</div>`;
  }
  if (S.aiError) {
    return `<div class="status-box error"><strong>⚠ AI call failed:</strong> ${S.aiError}<br><span style="color:var(--muted);font-size:10.5px">Check that <code style="font-family:'DM Mono',monospace">ANTHROPIC_API_KEY</code> is set in Vercel → Settings → Environment Variables.</span></div>`;
  }
  if (!S.aiInsights) return "";

  const u = S.aiUsage || {};
  const cached = u.cache_read_input_tokens > 0;
  const formatted = S.aiInsights.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

  return `<div class="ai-card">
    <div class="ai-head">
      <span class="ai-sparkle">✨</span>
      <span class="ai-title">Cohort Insights · Claude Opus 4.7</span>
      <span class="ai-model">${cached ? "cache HIT" : "cache MISS"}</span>
    </div>
    <div class="ai-body">${formatted}</div>
    <div class="ai-footer">
      <span>input: ${u.input_tokens || 0}</span>
      <span>output: ${u.output_tokens || 0}</span>
      <span>cache read: ${u.cache_read_input_tokens || 0}</span>
      <span>cache write: ${u.cache_creation_input_tokens || 0}</span>
      <span style="margin-left:auto">est: ~$${estCost(u).toFixed(4)}</span>
    </div>
  </div>`;
}

function estCost(u) {
  const inp = (u.input_tokens || 0) / 1e6 * 5;
  const out = (u.output_tokens || 0) / 1e6 * 25;
  const cr = (u.cache_read_input_tokens || 0) / 1e6 * 0.5;
  const cw = (u.cache_creation_input_tokens || 0) / 1e6 * 6.25;
  return inp + out + cr + cw;
}

function bindHandlers() {
  const dz = document.getElementById("dropzone");
  const fi = document.getElementById("file-input");
  if (dz && fi) {
    dz.addEventListener("click", () => fi.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (e) => {
      e.preventDefault(); dz.classList.remove("drag");
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fi.addEventListener("change", (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });
  }
  document.getElementById("demo-btn")?.addEventListener("click", loadDemo);
  document.getElementById("download-btn")?.addEventListener("click", downloadCSV);
  document.getElementById("ai-btn")?.addEventListener("click", getAIInsights);
  document.getElementById("reset-btn")?.addEventListener("click", () => {
    S = {students:null, fileName:null, error:null, warnings:[], aiInsights:null, aiUsage:null, aiLoading:false, aiError:null};
    render();
  });
}

function handleFile(file) {
  S.error = null;
  S.warnings = [];
  S.aiInsights = null; S.aiError = null; S.aiUsage = null;

  if (!file.name.toLowerCase().endsWith(".csv")) {
    S.error = "Please upload a .csv file.";
    render(); return;
  }

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      try {
        if (!results.data || results.data.length === 0) {
          throw new Error("CSV appears empty or has no data rows.");
        }
        const headers = Object.keys(results.data[0]).map(h => h.trim().toLowerCase().replace(/\s+/g,"_"));
        const missing = REQUIRED.filter(c => !headers.includes(c));
        if (missing.length > 0) throw new Error(`Missing required columns: ${missing.join(", ")}`);

        const processed = results.data.map(processRow);
        S.students = processed;
        S.fileName = file.name;

        // Warn if grade 5-7 students lack parent fields
        const need_parent = processed.filter(s => s.audience === "parent" && (!s.parent_first_name || !s.parent_last_name));
        if (need_parent.length > 0) {
          S.warnings.push(`${need_parent.length} grade 5–7 students missing parent_first_name / parent_last_name — T12 will fall back to "Hello Parent" greeting.`);
        }

        // Warn if optional rich fields are absent (scoring less precise)
        const sample = processed[0];
        if (sample.class_engagement_d1 == null && sample.class_engagement_d2 == null && sample.class_engagement_d3 == null) {
          S.warnings.push("No class_engagement_dN fields detected — score uses 5 dimensions instead of 6 (weights auto-redistributed).");
        }

        render();
      } catch (err) {
        S.error = err.message;
        render();
      }
    },
    error: (err) => { S.error = `CSV parse error: ${err.message}`; render(); },
  });
}

    "d1_attended","d2_attended","d3_attended",
    "test_d1_submitted","test_d2_submitted","test_d3_submitted",
    "hw_d1_submitted","hw_d2_submitted","hw_d3_submitted",
    "class_engagement_d1","class_engagement_d2","class_engagement_d3",
    "doubts_posted","replay_sessions","engagement_score_app",
    "watch_time_d1","watch_time_d2","watch_time_d3",
    "wa_msgs_sent","wa_msgs_read",
    "attn_pct","test_pct","hw_pct","class_eng_pct","product_eng_pct","wa_read_pct",
    "score","tier","chosen_template","handoff_reason",
  ];
  const csv = [
    headers.join(","),
    ...S.students.map(s => headers.map(h => {
      let v = s[h];
      if (v === undefined || v === null) v = "";
      if (typeof v === "boolean") v = v ? "TRUE" : "FALSE";
      if (typeof v === "string" && (v.includes(",") || v.includes('"'))) v = `"${v.replace(/"/g,'""')}"`;
      return v;
    }).join(","))
  ].join("\n");

  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `booster_scored_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function buildCohortStats() {
  const n = S.students.length;
  const tiers = {hot:0, warm75:0, warm50:0, d1ns:0};
  const aud = {parent:0, student:0};
  const grades = {};
  const regions = {};
  const templates = {};
  let attn=0, test=0, hw=0, classEng=0, classEngN=0;
  let d1=0, d2=0, d3=0, hw1=0, hw2=0, hw3=0, t1=0, t2=0, t3=0;

  S.students.forEach(s => {
    tiers[s.tier]++;
    aud[s.audience]++;
    grades[`G${s.grade}`] = (grades[`G${s.grade}`]||0) + 1;
    regions[s.region] = (regions[s.region]||0) + 1;
    templates[s.chosen_template] = (templates[s.chosen_template]||0) + 1;
    attn += s.attn_pct; test += s.test_pct; hw += s.hw_pct;
    if (s.class_eng_pct != null) { classEng += s.class_eng_pct; classEngN++; }
    if (s.d1_attended) d1++; if (s.d2_attended) d2++; if (s.d3_attended) d3++;
    if (s.hw_d1_submitted) hw1++; if (s.hw_d2_submitted) hw2++; if (s.hw_d3_submitted) hw3++;
    if (s.test_d1_submitted) t1++; if (s.test_d2_submitted) t2++; if (s.test_d3_submitted) t3++;
  });

  return {
    cohort_size: n,
    audience_split: aud,
    grade_distribution: grades,
    tier_distribution: tiers,
    tier_percentages: {
      hot:    +(tiers.hot/n*100).toFixed(1),
      warm75: +(tiers.warm75/n*100).toFixed(1),
      warm50: +(tiers.warm50/n*100).toFixed(1),
      d1ns:   +(tiers.d1ns/n*100).toFixed(1),
    },
    day_attendance_pct: {
      d1: +(d1/n*100).toFixed(1), d2: +(d2/n*100).toFixed(1), d3: +(d3/n*100).toFixed(1),
    },
    test_submission_pct: {
      d1: +(t1/n*100).toFixed(1), d2: +(t2/n*100).toFixed(1), d3: +(t3/n*100).toFixed(1),
    },
    homework_submission_pct: {
      d1: +(hw1/n*100).toFixed(1), d2: +(hw2/n*100).toFixed(1), d3: +(hw3/n*100).toFixed(1),
    },
    averages: {
      attendance_pct: Math.round(attn/n),
      test_pct: Math.round(test/n),
      hw_pct: Math.round(hw/n),
      class_engagement_pct: classEngN > 0 ? Math.round(classEng/classEngN) : null,
    },
    dropoff_rates: {
      d1_to_d2: d1 > 0 ? +((d1-d2)/d1*100).toFixed(1) : 0,
      d2_to_d3: d2 > 0 ? +((d2-d3)/d2*100).toFixed(1) : 0,
    },
    regions, templates_assigned: templates,
  };
}

async function getAIInsights() {
  S.aiLoading = true; S.aiError = null; S.aiInsights = null;
  render();

  try {
    const stats = buildCohortStats();
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({cohort_stats: stats}),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({error: `HTTP ${res.status}`}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    const data = await res.json();
    S.aiInsights = data.insights;
    S.aiUsage = data.usage;
    S.aiLoading = false;
    render();
  } catch (err) {
    S.aiError = err.message;
    S.aiLoading = false;
    render();
  }
}

render();
</script>
