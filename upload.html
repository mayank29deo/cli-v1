<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VED AI — Booster CSV Upload + Auto-Assign</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060C18;--panel:#0B1525;--card:#0F1D30;--border:#162438;
  --purple:#8B7CF8;--teal:#1ECDB5;--green:#2ECC9A;--amber:#F5BC1E;
  --red:#F06060;--blue:#5BA8FF;--pink:#E06EAA;--orange:#FF7A2E;
  --text:#C8DCF0;--muted:#4A6580;--faint:#0E1B2C;
}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes sparkle{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:52px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--border)}
.logo{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.35em;color:var(--purple)}
.divider{width:1px;height:20px;background:var(--border)}
.crumb{font-size:11.5px;font-weight:500}
.crumb span{color:var(--muted)}
.nav-links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-btn{font-size:11px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);color:var(--muted);transition:all .15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--purple);color:var(--purple)}
.nav-btn.on{border-color:var(--purple);color:var(--purple);background:rgba(139,124,248,.07)}

.wrap{max-width:1480px;margin:0 auto;padding:22px 28px 60px}
h1.pg-title{font-size:26px;font-weight:300;letter-spacing:-.01em;margin-bottom:3px}
.pg-sub{font-size:12px;color:var(--muted);margin-bottom:22px}

/* DROPZONE */
.dropzone{
  background:var(--card);border:2px dashed var(--border);border-radius:14px;
  padding:40px 28px;text-align:center;transition:all .2s;cursor:pointer;
  margin-bottom:22px;animation:up .4s ease;
}
.dropzone:hover{border-color:var(--purple);background:rgba(139,124,248,.03)}
.dropzone.drag{border-color:var(--purple);background:rgba(139,124,248,.08)}
.dz-icon{font-size:36px;margin-bottom:10px}
.dz-title{font-size:16px;font-weight:500;margin-bottom:5px}
.dz-sub{font-size:11.5px;color:var(--muted);line-height:1.65}
.dz-sub code{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--amber);background:var(--faint);padding:1px 6px;border-radius:3px}
.dz-hint{font-size:10.5px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);line-height:1.6}

.file-picker{display:none}

/* SCHEMA HELP */
.schema-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:22px;animation:up .4s ease .05s both}
.schema-title{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.schema-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;font-family:'DM Mono',monospace;font-size:10.5px}
.schema-col{color:var(--text);background:var(--faint);padding:5px 9px;border-radius:5px;border:1px solid var(--border)}
.schema-col .req{color:var(--red);margin-left:3px}
.schema-col .opt{color:var(--muted);margin-left:3px;font-size:9px}
.schema-demo{margin-top:12px;display:flex;gap:6px;align-items:center}
.schema-demo button{font-size:10.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);color:var(--purple)}
.schema-demo button:hover{background:rgba(139,124,248,.08)}

/* SUMMARY STATS (after upload) */
.results-section{display:none;animation:up .5s ease both}
.results-section.on{display:block}
.stats-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat-label{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.stat-val{font-size:22px;font-weight:500;font-family:'DM Mono',monospace;line-height:1}
.stat-sub{font-size:10px;color:var(--muted);margin-top:5px}

/* TOOLBAR */
.result-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill-chip{font-size:11.5px;padding:5px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace}
.rbar-btn{font-size:11.5px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);color:var(--text);font-weight:500;transition:all .15s}
.rbar-btn:hover{border-color:var(--purple);color:var(--purple)}
.rbar-btn.download{border-color:var(--green);color:var(--green);background:rgba(46,204,154,.06)}
.rbar-btn.download:hover{background:rgba(46,204,154,.14)}
.rbar-btn.ai{border-color:var(--orange);color:var(--orange);background:linear-gradient(135deg,rgba(255,122,46,.05),rgba(245,188,30,.05));display:inline-flex;align-items:center;gap:7px}
.rbar-btn.ai:hover{background:linear-gradient(135deg,rgba(255,122,46,.14),rgba(245,188,30,.14))}
.rbar-btn.ai .sparkle{animation:sparkle 1.8s ease-in-out infinite;display:inline-block}
.rbar-btn.reset{margin-left:auto;color:var(--muted)}
.rbar-btn:disabled{opacity:.5;cursor:not-allowed}

/* AI INSIGHTS CARD */
.ai-card{
  background:linear-gradient(135deg,rgba(255,122,46,.04),rgba(245,188,30,.03),rgba(139,124,248,.03));
  border:1px solid rgba(255,122,46,.25);border-radius:14px;padding:22px 24px;margin-bottom:22px;
  animation:up .4s ease;
}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ai-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.ai-sparkle{font-size:18px;animation:sparkle 1.8s ease-in-out infinite}
.ai-model{margin-left:auto;font-size:9.5px;color:var(--muted);font-family:'DM Mono',monospace;padding:3px 9px;border-radius:20px;border:1px solid var(--border)}
.ai-body{font-size:13px;line-height:1.85;white-space:pre-wrap;color:var(--text)}
.ai-body strong{color:var(--orange);font-weight:600}
.ai-footer{margin-top:14px;padding-top:14px;border-top:1px dashed rgba(255,122,46,.2);font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;display:flex;flex-wrap:wrap;gap:14px}
.ai-footer .k{color:var(--muted)}
.ai-footer .v{color:var(--text);margin-left:3px}

/* TABLE */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-wrap{max-height:560px;overflow:auto}
.leads-table{width:100%;border-collapse:collapse}
.leads-table th{text-align:left;padding:10px 11px;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:2;white-space:nowrap}
.leads-table td{padding:10px 11px;border-bottom:1px solid var(--faint);font-size:11.5px;vertical-align:middle}
.leads-table tr:hover td{background:rgba(139,124,248,.025)}
.sn-name{font-weight:500}
.sn-meta{font-size:9.5px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.reg-pill{font-size:9.5px;padding:2px 8px;border-radius:20px;background:var(--faint);color:var(--muted);border:1px solid var(--border);font-family:'DM Mono',monospace}
.metric-bit{font-size:10.5px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:4px;background:var(--faint);border:1px solid var(--border);display:inline-block;margin-right:3px}
.metric-bit.good{color:var(--green);border-color:rgba(46,204,154,.3);background:rgba(46,204,154,.06)}
.metric-bit.bad{color:var(--red);border-color:rgba(240,96,96,.3);background:rgba(240,96,96,.06)}
.score-cell{font-family:'DM Mono',monospace;font-size:13.5px;font-weight:500;text-align:center}
.tier-pill{font-size:9.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chosen-tpl{font-size:9.5px;font-family:'DM Mono',monospace;color:var(--amber);background:rgba(245,188,30,.08);padding:2px 7px;border-radius:4px;border:1px solid rgba(245,188,30,.2);display:inline-block;white-space:nowrap}
.reason-cell{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;max-width:260px;line-height:1.45}

/* ERROR / STATUS */
.status-box{padding:14px 18px;border-radius:10px;margin-bottom:16px;font-size:12px;line-height:1.55;animation:slideIn .25s ease}
.status-box.error{background:rgba(240,96,96,.08);border:1px solid rgba(240,96,96,.3);color:var(--red)}
.status-box.ok{background:rgba(46,204,154,.06);border:1px solid rgba(46,204,154,.25);color:var(--green)}
.status-box.loading{background:rgba(139,124,248,.07);border:1px solid rgba(139,124,248,.28);color:var(--purple);display:flex;align-items:center;gap:10px}
.status-box.loading::before{content:"";width:14px;height:14px;border:2px solid var(--purple);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1100px){
  .stats-strip{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:700px){
  .stats-strip{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:14px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ═══════════════════════════════════════════════════════
   BOOSTER CSV UPLOAD + LOCAL ALGORITHM
═══════════════════════════════════════════════════════ */

const TIER = {
  hot:    {label:"Hot",      color:"#F06060"},
  warm75: {label:"Warm-75",  color:"#FF7A2E"},
  warm50: {label:"Warm-50",  color:"#F5BC1E"},
  d1ns:   {label:"D1 NoShow",color:"#4A6580"},
};

const REGION_NAME = {TG:"Telangana",AP:"Andhra Pradesh",TN:"Tamil Nadu",MH:"Maharashtra",PB:"Patiala"};

// Same formula as apps_script.gs
const WEIGHTS = { ATTENDANCE: 0.60, HOMEWORK: 0.30, WA_READ: 0.10 };

const EXPECTED_COLS = {
  required: [
    "first_name","last_name","phone","email","region",
    "d1_attended","d2_attended","d3_attended",
    "hw_d1_submitted","hw_d2_submitted"
  ],
  optional: [
    "class","batch_id","wa_msgs_sent","wa_msgs_read"
  ],
};

/* ═══════════════════════════════════════════════════════
   ALGORITHM — runs locally, zero API cost
═══════════════════════════════════════════════════════ */

function parseBool(v) {
  if (v === true) return true;
  if (typeof v === "number") return v === 1;
  if (typeof v === "string") {
    const s = v.trim().toLowerCase();
    return s === "true" || s === "1" || s === "yes" || s === "y" || s === "✓";
  }
  return false;
}

function pickTemplate(student) {
  const {d1_attended, d2_attended, d3_attended, hw_d1_submitted, hw_d2_submitted} = student;

  // Terminal / conversion-phase logic (matches apps_script.gs pickTemplate)
  if (d3_attended) return "T14_COUNSELLOR_CONNECT";       // full cohort → priority handoff
  if (d2_attended && !d3_attended) return "T14_COUNSELLOR_CONNECT"; // D3 dropoff → still counsellor
  if (d1_attended && !d2_attended) return "T15_NURTURE_SOFT";       // D2 dropoff → soft nurture
  if (!d1_attended) return "T16_D1_NOSHOW";                          // never showed → empathy re-engage
  return "T13_INTENT_CAPTURE"; // fallback
}

function assignTier(score, d1, d2, d3) {
  if (!d1 && !d2 && !d3) return "d1ns";   // never attended, override on score
  if (score >= 0.85) return "hot";
  if (score >= 0.55) return "warm75";
  if (score >= 0.30) return "warm50";
  return "d1ns";
}

function reasonFor(s) {
  const attnN = (s.d1_attended?1:0) + (s.d2_attended?1:0) + (s.d3_attended?1:0);
  const hwN = (s.hw_d1_submitted?1:0) + (s.hw_d2_submitted?1:0);
  const readPct = Math.round(s.read_rate * 100);
  if (s.tier === "hot")    return `${attnN}/3 attn · ${hwN}/2 HW · ${readPct}% read — FULL COHORT`;
  if (s.tier === "warm75") return `${attnN}/3 attn (dropped D3) · ${hwN}/2 HW · ${readPct}% read`;
  if (s.tier === "warm50") return `${attnN}/3 attn (dropped D2) · ${hwN}/2 HW · ${readPct}% read`;
  return `Did not attend any class · ${readPct}% read only`;
}

function processRow(raw, idx) {
  // Normalize keys to lowercase snake_case
  const r = {};
  for (const k in raw) {
    const clean = k.trim().toLowerCase().replace(/\s+/g,"_");
    r[clean] = raw[k];
  }

  const s = {
    idx,
    first_name: String(r.first_name||"").trim(),
    last_name: String(r.last_name||"").trim(),
    phone: String(r.phone||"").trim(),
    email: String(r.email||"").trim(),
    region: String(r.region||"").trim().toUpperCase(),
    class: String(r.class||"").trim(),
    batch_id: String(r.batch_id||"").trim(),
    d1_attended: parseBool(r.d1_attended),
    d2_attended: parseBool(r.d2_attended),
    d3_attended: parseBool(r.d3_attended),
    hw_d1_submitted: parseBool(r.hw_d1_submitted),
    hw_d2_submitted: parseBool(r.hw_d2_submitted),
    wa_msgs_sent: +r.wa_msgs_sent || 0,
    wa_msgs_read: +r.wa_msgs_read || 0,
  };

  const attnN = (s.d1_attended?1:0) + (s.d2_attended?1:0) + (s.d3_attended?1:0);
  const hwN = (s.hw_d1_submitted?1:0) + (s.hw_d2_submitted?1:0);

  s.attn_pct = Math.round(attnN/3*100);
  s.hw_pct = Math.round(hwN/2*100);
  s.read_rate = s.wa_msgs_sent ? s.wa_msgs_read / s.wa_msgs_sent : 0;
  s.read_pct = Math.round(s.read_rate * 100);

  s.score = +(WEIGHTS.ATTENDANCE*(attnN/3) + WEIGHTS.HOMEWORK*(hwN/2) + WEIGHTS.WA_READ*s.read_rate).toFixed(4);
  s.tier = assignTier(s.score, s.d1_attended, s.d2_attended, s.d3_attended);
  s.chosen_template = pickTemplate(s);
  s.handoff_reason = reasonFor(s);

  return s;
}

/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */

let S = {
  students: null,     // processed rows
  fileName: null,
  error: null,
  aiInsights: null,
  aiUsage: null,
  aiLoading: false,
  aiError: null,
};

/* ═══════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════ */

function render() {
  document.getElementById("root").innerHTML = `
    ${rTopbar()}
    <div class="wrap">
      <h1 class="pg-title">CSV Upload · Auto-Assign</h1>
      <div class="pg-sub">Drop a Metabase dump — algorithm scores every lead, picks the next WATI template, and (optionally) asks Claude for cohort-level insights.</div>

      ${S.error ? `<div class="status-box error"><strong>⚠ Error:</strong> ${S.error}</div>` : ""}
      ${S.students ? `<div class="status-box ok">✓ Processed <strong>${S.students.length}</strong> leads from <code style="font-family:'DM Mono',monospace">${S.fileName}</code></div>` : ""}

      ${rDropzone()}
      ${!S.students ? rSchema() : ""}
      ${rResults()}
    </div>`;
  bindHandlers();
}

function rTopbar() {
  return `<div class="topbar">
    <span class="logo">VED AI</span>
    <div class="divider"></div>
    <span class="crumb"><span>Booster CLM ·</span> CSV Upload</span>
    <div class="nav-links">
      <a href="index.html"><button class="nav-btn">📊 Dashboard</button></a>
      <a href="simulator.html"><button class="nav-btn">⚡ Simulator</button></a>
      <a href="templates.html"><button class="nav-btn">📱 Templates</button></a>
      <a href="leads.html"><button class="nav-btn">🎯 Leads</button></a>
      <a href="email-preview.html"><button class="nav-btn">📧 Email</button></a>
      <a href="upload.html"><button class="nav-btn on">📤 Upload</button></a>
    </div>
  </div>`;
}

function rDropzone() {
  return `<div class="dropzone" id="dropzone">
    <div class="dz-icon">📤</div>
    <div class="dz-title">Drop your cohort CSV, or click to browse</div>
    <div class="dz-sub">
      Parsing happens entirely in your browser — data never leaves until you click
      <code>✨ Get AI insights</code>.
    </div>
    <input type="file" id="file-input" class="file-picker" accept=".csv">
    <div class="dz-hint">
      Expected columns below. Order doesn't matter, header names normalize to <code style="font-family:'DM Mono',monospace;color:var(--amber)">snake_case</code>.
      Boolean cells accept <code style="font-family:'DM Mono',monospace;color:var(--amber)">TRUE / FALSE / 1 / 0 / yes / no</code>.
    </div>
  </div>`;
}

function rSchema() {
  return `<div class="schema-card">
    <div class="schema-title">Expected CSV Schema</div>
    <div class="schema-cols">
      ${EXPECTED_COLS.required.map(c => `<div class="schema-col">${c}<span class="req">*</span></div>`).join("")}
      ${EXPECTED_COLS.optional.map(c => `<div class="schema-col">${c}<span class="opt">opt</span></div>`).join("")}
    </div>
    <div class="schema-demo">
      <span style="font-size:10.5px;color:var(--muted)">No CSV handy?</span>
      <button id="demo-btn">Load demo data (20 rows)</button>
    </div>
  </div>`;
}

function rResults() {
  if (!S.students) return "";

  const n = S.students.length;
  const tiers = {hot:0, warm75:0, warm50:0, d1ns:0};
  const regions = {};
  let totalScore = 0, totalAttn = 0, totalHw = 0, totalRead = 0;

  S.students.forEach(s => {
    tiers[s.tier]++;
    regions[s.region] = (regions[s.region]||0) + 1;
    totalScore += s.score;
    totalAttn += s.attn_pct;
    totalHw += s.hw_pct;
    totalRead += s.read_pct;
  });

  const avgScore = (totalScore/n).toFixed(2);
  const avgAttn = Math.round(totalAttn/n);
  const avgHw = Math.round(totalHw/n);
  const avgRead = Math.round(totalRead/n);

  return `<div class="results-section on">
    ${rStats(n, tiers, avgScore, avgAttn, avgHw, avgRead)}
    ${rBar(n)}
    ${rAIInsights()}
    ${rTable()}
  </div>`;
}

function rStats(n, tiers, avgScore, avgAttn, avgHw, avgRead) {
  const items = [
    {label:"Total leads",  val:n,             color:"#8B7CF8", sub:"rows processed"},
    {label:"🔥 Hot",        val:tiers.hot,     color:"#F06060", sub:"all 3 attended"},
    {label:"🟠 Warm-75",    val:tiers.warm75,  color:"#FF7A2E", sub:"D3 dropoff"},
    {label:"🟡 Warm-50",    val:tiers.warm50,  color:"#F5BC1E", sub:"D2 dropoff"},
    {label:"⚫ D1 NoShow",  val:tiers.d1ns,    color:"#4A6580", sub:"nurture bucket"},
    {label:"Avg score",    val:avgScore,      color:"#2ECC9A", sub:`${avgAttn}% attn · ${avgHw}% hw · ${avgRead}% read`},
  ];
  return `<div class="stats-strip">
    ${items.map(it => `<div class="stat">
      <div class="stat-label">${it.label}</div>
      <div class="stat-val" style="color:${it.color}">${it.val}</div>
      <div class="stat-sub">${it.sub}</div>
    </div>`).join("")}
  </div>`;
}

function rBar(n) {
  return `<div class="result-bar">
    <span class="pill-chip">${n} leads</span>
    <span class="pill-chip">Scored & tiered</span>
    <span class="pill-chip">Template assigned</span>
    <button class="rbar-btn download" id="download-btn">⬇ Download scored CSV</button>
    <button class="rbar-btn ai" id="ai-btn" ${S.aiLoading?"disabled":""}>
      <span class="sparkle">✨</span> ${S.aiLoading ? "Asking Claude…" : S.aiInsights ? "Re-run insights" : "Get AI insights"}
    </button>
    <button class="rbar-btn reset" id="reset-btn">✕ Reset</button>
  </div>`;
}

function rAIInsights() {
  if (S.aiLoading) {
    return `<div class="status-box loading">Calling Claude Opus 4.7 with aggregated cohort stats (no raw rows sent). Typically 3–6 seconds…</div>`;
  }
  if (S.aiError) {
    return `<div class="status-box error"><strong>⚠ AI call failed:</strong> ${S.aiError}<br><span style="color:var(--muted);font-size:10.5px">Check that <code style="font-family:'DM Mono',monospace">ANTHROPIC_API_KEY</code> is set in Vercel → Settings → Environment Variables.</span></div>`;
  }
  if (!S.aiInsights) return "";

  const u = S.aiUsage || {};
  const cached = u.cache_read_input_tokens > 0;
  const formatted = S.aiInsights.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

  return `<div class="ai-card">
    <div class="ai-head">
      <span class="ai-sparkle">✨</span>
      <span class="ai-title">Cohort Insights · Claude Opus 4.7</span>
      <span class="ai-model">${cached ? "cache HIT" : "cache MISS"}</span>
    </div>
    <div class="ai-body">${formatted}</div>
    <div class="ai-footer">
      <span><span class="k">input tokens:</span><span class="v">${u.input_tokens || 0}</span></span>
      <span><span class="k">output tokens:</span><span class="v">${u.output_tokens || 0}</span></span>
      <span><span class="k">cache read:</span><span class="v">${u.cache_read_input_tokens || 0}</span></span>
      <span><span class="k">cache write:</span><span class="v">${u.cache_creation_input_tokens || 0}</span></span>
      <span style="margin-left:auto"><span class="k">est. cost:</span><span class="v">~$${estCost(u).toFixed(4)}</span></span>
    </div>
  </div>`;
}

function estCost(u) {
  // Opus 4.7: $5/M input, $25/M output, cache read ~0.1x, cache write ~1.25x
  const inp = (u.input_tokens || 0) / 1e6 * 5;
  const out = (u.output_tokens || 0) / 1e6 * 25;
  const cr = (u.cache_read_input_tokens || 0) / 1e6 * 0.5;
  const cw = (u.cache_creation_input_tokens || 0) / 1e6 * 6.25;
  return inp + out + cr + cw;
}

function bindHandlers() {
  const dz = document.getElementById("dropzone");
  const fi = document.getElementById("file-input");
  if (dz && fi) {
    dz.addEventListener("click", () => fi.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (e) => {
      e.preventDefault(); dz.classList.remove("drag");
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fi.addEventListener("change", (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });
  }

  document.getElementById("demo-btn")?.addEventListener("click", loadDemo);
  document.getElementById("download-btn")?.addEventListener("click", downloadCSV);
  document.getElementById("ai-btn")?.addEventListener("click", getAIInsights);
  document.getElementById("reset-btn")?.addEventListener("click", () => {
    S = {students:null, fileName:null, error:null, aiInsights:null, aiUsage:null, aiLoading:false, aiError:null};
    render();
  });
}

function handleFile(file) {
  S.error = null;
  S.aiInsights = null; S.aiError = null; S.aiUsage = null;

  if (!file.name.toLowerCase().endsWith(".csv")) {
    S.error = "Please upload a .csv file.";
    render(); return;
  }

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      try {
        if (!results.data || results.data.length === 0) {
          throw new Error("CSV appears empty or has no data rows.");
        }

        const headers = Object.keys(results.data[0]).map(h => h.trim().toLowerCase().replace(/\s+/g,"_"));
        const missing = EXPECTED_COLS.required.filter(c => !headers.includes(c));
        if (missing.length > 0) {
          throw new Error(`Missing required columns: ${missing.join(", ")}`);
        }

        S.students = results.data.map(processRow);
        S.fileName = file.name;
        render();
      } catch (err) {
        S.error = err.message;
        render();
      }
    },
    error: (err) => {
      S.error = `CSV parse error: ${err.message}`;
      render();
    },
  });
}

    headers.join(","),
    ...S.students.map(s => headers.map(h => {

      if (typeof v === "string" && (v.includes(",") || v.includes('"'))) v = `"${v.replace(/"/g,'""')}"`;
      return v;
    }).join(","))
  ].join("\n");

  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `booster_scored_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

/* ═══════════════════════════════════════════════════════
   AI CALL — aggregated stats only, no raw rows
═══════════════════════════════════════════════════════ */

function buildCohortStats() {
  const n = S.students.length;
  const tiers = {hot:0, warm75:0, warm50:0, d1ns:0};
  const regions = {};
  const templates = {};
  let totalAttn = 0, totalHw = 0, totalRead = 0;
  let d1 = 0, d2 = 0, d3 = 0;
  let hw1 = 0, hw2 = 0;

  S.students.forEach(s => {
    tiers[s.tier]++;
    if (s.region) {
      regions[s.region] = regions[s.region] || {count:0, hot:0, d1:0, d2:0, d3:0};
      regions[s.region].count++;
      if (s.tier === "hot") regions[s.region].hot++;
      if (s.d1_attended) regions[s.region].d1++;
      if (s.d2_attended) regions[s.region].d2++;
      if (s.d3_attended) regions[s.region].d3++;
    }
    templates[s.chosen_template] = (templates[s.chosen_template]||0) + 1;
    totalAttn += s.attn_pct;
    totalHw += s.hw_pct;
    totalRead += s.read_pct;
    if (s.d1_attended) d1++;
    if (s.d2_attended) d2++;
    if (s.d3_attended) d3++;
    if (s.hw_d1_submitted) hw1++;
    if (s.hw_d2_submitted) hw2++;
  });

  return {
    cohort_size: n,
    tier_distribution: tiers,
    tier_percentages: {
      hot:    +(tiers.hot/n*100).toFixed(1),
      warm75: +(tiers.warm75/n*100).toFixed(1),
      warm50: +(tiers.warm50/n*100).toFixed(1),
      d1ns:   +(tiers.d1ns/n*100).toFixed(1),
    },
    day_attendance: {
      d1: d1, d1_pct: +(d1/n*100).toFixed(1),
      d2: d2, d2_pct: +(d2/n*100).toFixed(1),
      d3: d3, d3_pct: +(d3/n*100).toFixed(1),
    },
    homework_submission: {
      hw_d1: hw1, hw_d1_pct: +(hw1/n*100).toFixed(1),
      hw_d2: hw2, hw_d2_pct: +(hw2/n*100).toFixed(1),
    },
    averages: {
      attendance_pct: Math.round(totalAttn/n),
      homework_pct: Math.round(totalHw/n),
      wa_read_pct: Math.round(totalRead/n),
    },
    dropoff_rates: {
      d1_to_d2: d1 > 0 ? +((d1-d2)/d1*100).toFixed(1) : 0,
      d2_to_d3: d2 > 0 ? +((d2-d3)/d2*100).toFixed(1) : 0,
    },
    regions: regions,
    templates_assigned: templates,
  };
}

async function getAIInsights() {
  S.aiLoading = true; S.aiError = null; S.aiInsights = null;
  render();

  try {
    const stats = buildCohortStats();
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({cohort_stats: stats}),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({error: `HTTP ${res.status}`}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const data = await res.json();
    S.aiInsights = data.insights;
    S.aiUsage = data.usage;
    S.aiLoading = false;
    render();
  } catch (err) {
    S.aiError = err.message;
    S.aiLoading = false;
    render();
  }
}
