<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VED AI — Booster Journey Simulator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060C18;--panel:#0B1525;--card:#0F1D30;--border:#162438;
  --purple:#8B7CF8;--teal:#1ECDB5;--green:#2ECC9A;--amber:#F5BC1E;
  --red:#F06060;--blue:#5BA8FF;--pink:#E06EAA;--orange:#FF7A2E;
  --text:#C8DCF0;--muted:#4A6580;--faint:#0E1B2C;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(139,124,248,.3)}50%{box-shadow:0 0 0 6px rgba(139,124,248,.25)}}
@keyframes typingBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:52px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.35em;color:var(--purple)}
.divider{width:1px;height:20px;background:var(--border)}
.crumb{font-size:11.5px;font-weight:500}
.crumb span{color:var(--muted)}
.sim-badge{font-size:10px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(245,188,30,.07);border:1px solid rgba(245,188,30,.25);color:var(--amber);letter-spacing:.05em}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-btn{font-size:11px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);color:var(--muted);transition:all .15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--purple);color:var(--purple)}
.nav-btn.on{border-color:var(--purple);color:var(--purple);background:rgba(139,124,248,.07)}

/* STUDENT BAR */
.student-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0}
.sb-label{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.persona-group{display:flex;gap:7px;flex:1;flex-wrap:wrap}
.persona{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;border:1px solid var(--border);cursor:pointer;transition:all .15s;font-size:11.5px;min-width:180px}
.persona:hover{border-color:var(--muted)}
.persona.on{border-color:var(--purple);background:rgba(139,124,248,.07)}
.persona-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.persona-name{font-weight:500;line-height:1.2}
.persona-tier{font-size:9.5px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.control-group{display:flex;gap:6px;align-items:center}
.ctrl-btn{font-size:11px;padding:6px 14px;border-radius:7px;border:1px solid var(--border);color:var(--text);transition:all .15s;font-weight:500}
.ctrl-btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.ctrl-btn.primary:hover:not(:disabled){background:#9d8ff9;box-shadow:0 4px 14px rgba(139,124,248,.35)}
.ctrl-btn:disabled{opacity:.5;cursor:not-allowed}
.ctrl-btn:not(.primary):hover{border-color:var(--purple);color:var(--purple)}

/* LAYOUT */
.layout{display:grid;grid-template-columns:420px 1fr 350px;height:calc(100vh - 52px - 63px);overflow:hidden}
.panel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel:last-child{border-right:none}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panel-scroll{flex:1;overflow-y:auto;padding:16px}

/* TIMELINE (left panel) */
.day-sep{
  display:flex;align-items:center;gap:10px;margin:14px 0 8px;
  font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);
}
.day-sep:first-child{margin-top:0}
.day-sep::before{content:"";flex:0 0 14px;height:1px;background:rgba(139,124,248,.4)}
.day-sep::after{content:"";flex:1;height:1px;background:rgba(139,124,248,.2)}

.event{
  display:flex;gap:12px;padding:10px 12px;border-radius:10px;
  border:1px solid transparent;transition:all .2s;cursor:pointer;margin-bottom:3px;
  position:relative;
}
.event:hover{background:var(--panel)}
.event.fired{opacity:.92}
.event.fired .ev-dot{background:var(--green);border-color:var(--green);color:#0d1418}
.event.active{background:rgba(139,124,248,.07);border-color:rgba(139,124,248,.3)}
.event.active .ev-dot{animation:nodePulse 1.2s ease infinite;border-color:var(--purple);background:rgba(139,124,248,.15);color:var(--purple)}
.event.skipped{opacity:.35}
.event.skipped .ev-dot{background:var(--faint);border-color:var(--border);color:var(--muted)}

.ev-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:28px}
.ev-dot{width:28px;height:28px;border-radius:50%;background:var(--faint);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .3s;position:relative;z-index:1}
.ev-line{width:2px;flex:1;min-height:18px;background:var(--border);transition:background .3s}
.event.fired .ev-line{background:var(--green)}
.event.skipped .ev-line{background:var(--faint)}

.ev-body{flex:1;min-width:0;padding:2px 0}
.ev-time{font-size:9.5px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:3px;letter-spacing:.05em}
.ev-label{font-size:12px;font-weight:500;line-height:1.3;margin-bottom:3px}
.ev-meta{font-size:10px;color:var(--muted);line-height:1.4}
.ev-tpl{
  font-size:9.5px;font-family:'DM Mono',monospace;color:var(--amber);
  margin-top:5px;display:inline-block;padding:1px 6px;border-radius:4px;
  background:rgba(245,188,30,.08);border:1px solid rgba(245,188,30,.18);
}
.ev-skipped-note{font-size:9.5px;color:var(--red);margin-top:3px;font-style:italic}

/* CENTER: ORCHESTRATION */
.orc-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;animation:up .4s ease both}
.orc-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.orc-title::before{content:"";width:4px;height:12px;background:var(--purple);border-radius:2px}

.pipeline{display:flex;flex-direction:column;gap:0}
.pnode{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--faint)}
.pnode:last-child{border-bottom:none}
.pcircle{width:32px;height:32px;border-radius:50%;background:var(--faint);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.pcircle.done{background:rgba(46,204,154,.1);border-color:var(--green);color:var(--green)}
.pcircle.active{background:rgba(139,124,248,.12);border-color:var(--purple);color:var(--purple);animation:nodePulse 1.2s ease infinite}
.pbody{flex:1;min-width:0}
.plabel{font-size:12px;font-weight:500;margin-bottom:3px}
.pdesc{font-size:11px;color:var(--muted);line-height:1.5}
.pdesc code{font-family:'DM Mono',monospace;background:var(--faint);padding:1px 5px;border-radius:3px;color:var(--amber);font-size:10.5px}

.state-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--faint);font-size:11.5px}
.state-row:last-child{border-bottom:none}
.state-lbl{color:var(--muted)}
.state-val{font-family:'DM Mono',monospace;font-weight:500}

.kpi-inline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.kpi-mini{background:var(--faint);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.kpi-mini-label{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kpi-mini-val{font-size:18px;font-weight:500;font-family:'DM Mono',monospace}

.wati-call{background:var(--faint);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'DM Mono',monospace;font-size:10.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap;word-break:break-all}
.wati-call .k{color:var(--purple)}
.wati-call .s{color:var(--teal)}
.wati-call .n{color:var(--amber)}

/* PHONE (right) */
.phone-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
.phone{width:270px;flex-shrink:0;border-radius:32px;overflow:hidden;border:7px solid #181830;box-shadow:0 18px 54px rgba(0,0,0,.85);display:flex;flex-direction:column;background:#0d1418;max-height:100%}
.phone-inner{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:84px;height:22px;background:#181830;border-radius:0 0 13px 13px;z-index:5}
.wa-hdr{background:#202c33;padding:34px 12px 9px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.wa-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#FF7A2E,#F5BC1E)}
.wa-name{font-size:12.5px;font-weight:600;color:#e9edef}
.wa-status{font-size:9.5px;color:#8696a0;margin-top:1px}
.wa-msgs{flex:1;overflow-y:auto;padding:8px 9px 5px;background:#0d1418}
.wa-msgs::-webkit-scrollbar{width:2px}
.wa-msgs::-webkit-scrollbar-thumb{background:#2a3942}
.wa-date{text-align:center;margin:6px 0 10px}
.wa-date span{background:#182229;color:#8696a0;font-size:9.5px;padding:3px 9px;border-radius:7px}
.bw{display:flex;margin-bottom:2px}
.bw.in{justify-content:flex-start}
.bw.out{justify-content:flex-end}
.bubble{max-width:88%;padding:7px 10px 16px;border-radius:8px 8px 8px 2px;font-size:11.5px;line-height:1.55;color:#e9edef;background:#202c33;position:relative;word-break:break-word;animation:slideIn .3s ease both;white-space:pre-wrap}
.bw.out .bubble{background:#005c4b;border-radius:8px 8px 2px 8px}
.bubble strong{color:#fff}
.btime{position:absolute;bottom:3px;right:8px;font-size:8.5px;color:#8696a0;display:flex;align-items:center;gap:3px}
.ticks{color:#53bdeb}
.typing{background:#202c33;border-radius:8px 8px 8px 2px;padding:9px 12px;display:inline-flex;gap:4px;align-items:center;margin-bottom:5px}
.tdot{width:6px;height:6px;border-radius:50%;background:#8696a0}
.tdot:nth-child(1){animation:typingBounce 1.3s ease infinite 0s}
.tdot:nth-child(2){animation:typingBounce 1.3s ease infinite .18s}
.tdot:nth-child(3){animation:typingBounce 1.3s ease infinite .36s}
.bubble .poster{background:linear-gradient(135deg,#FF7A2E,#F5BC1E);height:62px;border-radius:4px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9.5px;font-weight:600;letter-spacing:.05em}
.btn-row{display:flex;flex-direction:column;gap:2px;background:#202c33;border-radius:2px 2px 8px 8px;padding:5px 8px;margin-top:1px;max-width:88%}
.bw.in .btn-row{align-self:flex-start}
.mini-btn{background:rgba(255,255,255,.06);color:#53bdeb;padding:6px;text-align:center;font-size:11px;font-weight:500;border-radius:4px}

.wa-inp{background:#202c33;padding:7px 9px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.wa-inp-fake{flex:1;background:#2a3942;border-radius:20px;padding:6px 13px;font-size:10.5px;color:#8696a0}
.wa-mic{width:30px;height:30px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0}

@media (max-width:1200px){
  .layout{grid-template-columns:360px 1fr 310px}
}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr;overflow-y:auto}
  .panel{border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ═══════════════════════════════════════════════════════
   4 STUDENT PERSONAS (matching the 4 lead tiers)
═══════════════════════════════════════════════════════ */

const PERSONAS = [
  {
    id:0, first:"Arjun", last:"Reddy", tier:"hot", tierLabel:"HOT", avColor:"#F06060",
    region:"TG", state:"Telangana",
    d1_attended:true, d2_attended:true, d3_attended:true,
    hw_d1:true, hw_d2:true,
    read_rate:0.95,
  },
  {
    id:1, first:"Lakshmi", last:"Rao", tier:"warm75", tierLabel:"WARM-75", avColor:"#FF7A2E",
    region:"AP", state:"Andhra Pradesh",
    d1_attended:true, d2_attended:true, d3_attended:false,
    hw_d1:true, hw_d2:true,
    read_rate:0.88,
  },
  {
    id:2, first:"Saanvi", last:"Desai", tier:"warm50", tierLabel:"WARM-50", avColor:"#F5BC1E",
    region:"MH", state:"Maharashtra",
    d1_attended:true, d2_attended:false, d3_attended:false,
    hw_d1:true, hw_d2:false,
    read_rate:0.64,
  },
  {
    id:3, first:"Harini", last:"Venkatesh", tier:"d1ns", tierLabel:"D1 NO-SHOW", avColor:"#4A6580",
    region:"TN", state:"Tamil Nadu",
    d1_attended:false, d2_attended:false, d3_attended:false,
    hw_d1:false, hw_d2:false,
    read_rate:0.72,
  },
];

/* ═══════════════════════════════════════════════════════
   JOURNEY EVENT LIST (resolved per persona)
═══════════════════════════════════════════════════════ */

function buildJourney(p) {
  const J = [];
  const add = (day, time, label, meta, tpl, ch, msgFn, cond) => {
    J.push({day, time, label, meta, tpl, ch, msgFn, skipped: cond ? !cond(p) : false});
  };

  // ─── PRE-COHORT + DAY 0 ─────────────────────
  add("Pre-cohort", "D-3 · 18:00", "Hype snippet video",
      "Excitement · all enrolled", "T10_HYPE_VIDEO", "WA",
      p => `${p.first}, 30-second taste of what's coming 🎬\n\n*ved.app/snip/C17*\n\nThat's Neha Ma'am breaking down a concept that took me 3 classes in school. You'll see it on Day 1. 🤯\n\nSet a reminder for your batch!`);

  add("Pre-cohort", "D-2 · 11:00", "Curiosity hook",
      "Teasing · engagement boost", "T11_CURIOSITY_HOOK", "WA",
      p => `Quick riddle, ${p.first}:\n\n*Why do astronauts float even though gravity is still pulling them?*\n\nReply with your guess? We'll reveal the answer in Day 1's class on Rotational Mechanics. 🔍\n\n(No Googling! 😉)`);

  add("Day 0", "D0 · 09:00", "Welcome + batch schedule (regional)",
      `Warm · onboarding · ${p.region} poster`, "T01_WELCOME", "WA",
      p => `Hey ${p.first}! 🎉 Welcome to the Vedantu Booster Trial!\n\nYour 3-day adventure starts *Apr 24 at 6:30 PM*.\n\n📅 *Your schedule:*\nDay 1 · Apr 24 · 6:30 PM — Rotational Mechanics\nDay 2 · Apr 25 · 6:30 PM — Gravitation\nDay 3 · Apr 26 · 6:30 PM — Oscillations\n\n*How to join:*\n1. Download the Vedantu app\n2. Log in with: +91 98••• / ${p.first.toLowerCase()}@mail.com\n3. Class appears under 'My Courses'\n\nYour teacher: *Neha Ma'am* (Physics)\nSee you there! 🚀`,
      null);

  add("Day 0", "D0 · 20:00", "T-24h reminder",
      "Anticipation · tomorrow is Day 1", "T02_REMINDER_T24H", "WA",
      p => `${p.first}, tomorrow is Day 1! ⏰\n\n6:30 PM sharp · *Neha Ma'am* takes you through:\n👉 Rotational Mechanics\n\nSneak peek: Why does a spinning top not fall?\n\nSet a reminder. See you at 6:30 PM. 💪`);

  // ─── DAY 1 ──────────────────────────────────
  add("Day 1", "D1 · 15:30", "T-3h reminder + prep",
      "Curious · question hook", "T03_REMINDER_T3H", "WA",
      p => `${p.first}, quick question before class at 6:30 PM:\n\n*Why do ice skaters spin faster when they pull their arms in?*\n\nToday we'll crack this together in Rotational Mechanics. 3 hours to go — be ready with pen + notebook. ✏️`);

  add("Day 1", "D1 · 18:00", "Class starts in 30 min",
      "Urgent · FOMO · Join Now CTA", "T04_JOIN_NOW", "WA",
      p => `${p.first}, class starts in *30 minutes* ⚡\n\n6:30 PM · tap to join:\n👉 ved.app/j/C17D1\n\nDon't make Neha Ma'am start without you! 👀`);

  add("Day 1", "D1 · 20:15", "Post-class summary",
      "Reflective · only sent if attended", "T05_POST_SUMMARY", "WA",
      p => `That's a wrap on *Day 1* 🎯\n\nToday in Rotational Mechanics you learned:\n✅ Moment of inertia & its intuition\n✅ Angular momentum conservation\n✅ 5 JEE-level problems solved\n\nHow was the class? → ved.app/fb/C17D1\n\nYour detailed performance report is heading to your inbox. 📧`,
      p => p.d1_attended);

  add("Day 1", "D1 · 20:15", "Daily performance email",
      "Vedantu-orange · attendance + HW status", "EMAIL_D1", "EMAIL",
      p => `📧 Email: Day 1 performance report (orange template)`,
      p => p.d1_attended);

  add("Day 1", "D1 · 20:30", "Homework assigned",
      "Coach · only if attended", "T06_HW_ASSIGNED", "WA",
      p => `${p.first}, time to lock in what you learned 💪\n\n*Day 1 Homework: Rotational Mechanics*\n⏱ 25 min · Deadline: Tomorrow 6 PM\n\nStart here → ved.app/hw/C17D1\n\nStudents who submit HW on time are *3.4× more likely* to crack full concepts. Be that student. 🧠`,
      p => p.d1_attended);

  // D1 branch: no-show OR low engagement
  add("Day 1", "D1 · 21:00", "D1 no-show re-engage",
      "Empathy · 2nd chance for Day 2", "T16_D1_NOSHOW", "WA",
      p => `${p.first}, we missed you today 💙\n\nLife happens. Completely get it.\n\nHere's the thing — Day 2 tomorrow at 6:30 PM covers *Gravitation*, which doesn't need Day 1 context. You can jump right back in.\n\n30-second catch-up of Day 1: ved.app/recap/C17D1\n\nRejoin tomorrow? We saved your seat. 🪑✨`,
      p => !p.d1_attended);

  add("Day 1", "D1 · 21:15", "Daily perf · High",
      "Praise + push · attn + HW both ✓", "T08_PERF_HIGH", "WA",
      p => `${p.first}, you're *crushing it* 🏆\n\n📊 Day 1 scorecard:\nAttendance: 100% ✅\nHomework: 100% ✅\nBatch rank: Top 8%\n\nThis is what top-1% students do. *Don't stop now.*\n\nTomorrow's class is the deepest one — you're primed for it. 🚀`,
      p => p.d1_attended && p.hw_d1);

  add("Day 1", "D1 · 21:15", "Daily perf · Low",
      "Urgency nudge · partial engagement", "T09_PERF_LOW", "WA",
      p => `${p.first}, I don't want you to miss out 💭\n\nDay 1 check: you ${p.hw_d1 ? "attended but skipped HW" : "missed homework"}.\n\nLook — 2 more days. *Just 2.* The Day 3 session is where everything clicks and ~70% of students end up wanting to continue after it.\n\nDon't let Day 1 decide your story. Show up tomorrow.\n\nTap to confirm → ved.app/confirm`,
      p => p.d1_attended && !p.hw_d1);

  add("Day 1", "D1 · 21:30", "T-24h reminder (for Day 2)",
      "Anticipation · Day 2 tomorrow", "T02_REMINDER_T24H", "WA",
      p => `${p.first}, tomorrow is Day 2! ⏰\n\n6:30 PM sharp · *Neha Ma'am* takes you through:\n👉 Gravitation\n\nSneak peek: How Newton figured out the Moon is falling.\n\nSet a reminder. 💪`);

  // ─── DAY 2 ──────────────────────────────────
  add("Day 2", "D2 · 12:00", "HW reminder (if unsubmitted)",
      "Nudge · 6h before deadline", "T07_HW_REMINDER", "WA",
      p => `${p.first}, your Rotational Mechanics homework is still pending 👀\n\n6 hours left. Takes ~20 minutes.\n\nTap to submit → ved.app/hw/C17D1\n\nEven 5 questions beats 0. Show up for yourself. 🔥`,
      p => p.d1_attended && !p.hw_d1);

  add("Day 2", "D2 · 15:30", "T-3h reminder + prep",
      "Curious · question hook", "T03_REMINDER_T3H", "WA",
      p => `${p.first}, quick question before class at 6:30 PM:\n\n*Why don't satellites fall back to Earth?*\n\nToday we'll crack this together in Gravitation. 3 hours to go — be ready with pen + notebook. ✏️`);

  add("Day 2", "D2 · 18:00", "Class starts in 30 min",
      "Urgent · Join Now CTA", "T04_JOIN_NOW", "WA",

let S = {
  personaIdx: 0,
  activeEvent: 0,
  playing: false,
  playedUpTo: 0,  // how many events have "fired" in the phone
  playTimer: null,
};

function currentPersona() { return PERSONAS[S.personaIdx]; }
function currentJourney() { return buildJourney(currentPersona()); }

function render() {

}

function rTimelinePanel() {
  const J = currentJourney();
  const groups = [];
  let lastDay = null;
  J.forEach((ev, i) => {
    if (ev.day !== lastDay) { groups.push({day:ev.day, items:[]}); lastDay = ev.day; }
    groups[groups.length-1].items.push({...ev, idx:i});
  });

  return `<div class="panel">
    <div class="panel-head">
      <span class="panel-title">Journey Timeline</span>
      <span style="font-size:10px;color:var(--muted)">${J.length} events · ${S.playedUpTo} fired</span>
    </div>
    <div class="panel-scroll">
      ${groups.map(g => `
        <div class="day-sep">${g.day}</div>
        ${g.items.map(ev => {
          const fired = ev.idx < S.playedUpTo;
          const active = ev.idx === S.activeEvent;
          const cls = ev.skipped ? "skipped" : fired ? "fired" : active ? "active" : "";
          return `<div class="event ${cls}" data-evidx="${ev.idx}">
            <div class="ev-col">
              <div class="ev-dot">${fired && !ev.skipped ? "✓" : ev.skipped ? "∅" : "•"}</div>
              <div class="ev-line"></div>
            </div>
            <div class="ev-body">
              <div class="ev-time">${ev.time} ${ev.ch === "EMAIL" ? "📧" : "💬"}</div>
              <div class="ev-label">${ev.label}</div>
              <div class="ev-meta">${ev.meta}</div>
              <div class="ev-tpl">${ev.tpl}</div>
              ${ev.skipped ? `<div class="ev-skipped-note">SKIPPED for this persona (condition not met)</div>` : ""}
            </div>
          </div>`;
        }).join("")}
      `).join("")}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   HANDLERS + ANIMATION
═══════════════════════════════════════════════════════ */

function bindHandlers() {
  document.querySelectorAll("[data-pidx]").forEach(el => {
    el.addEventListener("click", () => {
      stopPlay();
      S.personaIdx = +el.dataset.pidx;
      S.activeEvent = 0;
      S.playedUpTo = 0;
      render();
    });
  });

  document.querySelectorAll("[data-evidx]").forEach(el => {
    el.addEventListener("click", () => {
      stopPlay();
      S.activeEvent = +el.dataset.evidx;
      render();
    });
  });

  document.getElementById("reset-btn")?.addEventListener("click", () => {
    stopPlay();
    S.activeEvent = 0;
    S.playedUpTo = 0;
    render();
  });

  document.getElementById("step-btn")?.addEventListener("click", () => {
    stopPlay();
    stepForward();
  });

  document.getElementById("play-btn")?.addEventListener("click", () => {
    S.playing ? stopPlay() : startPlay();
  });
}

function stepForward() {
  const J = currentJourney();
  if (S.playedUpTo < J.length) {
    S.playedUpTo++;
    S.activeEvent = S.playedUpTo - 1;
    render();
  }
}

function startPlay() {
  S.playing = true;
  render();
  S.playTimer = setInterval(() => {
    const J = currentJourney();
    if (S.playedUpTo >= J.length) {
      stopPlay();
      return;
    }
    stepForward();
  }, 900);
}

function stopPlay() {
  S.playing = false;
  if (S.playTimer) { clearInterval(S.playTimer); S.playTimer = null; }
  render();
}

function scrollWA() {
  setTimeout(() => {
    const el = document.getElementById("wa-msgs");
    if (el) el.scrollTop = el.scrollHeight;
  }, 60);
}

/* ── BOOT ── */
render();
</script>
