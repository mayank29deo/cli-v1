<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VED AI — Booster Template Library</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060C18;--panel:#0B1525;--card:#0F1D30;--border:#162438;
  --purple:#8B7CF8;--teal:#1ECDB5;--green:#2ECC9A;--amber:#F5BC1E;
  --red:#F06060;--blue:#5BA8FF;--pink:#E06EAA;--orange:#FF7A2E;
  --text:#C8DCF0;--muted:#4A6580;--faint:#0E1B2C;
}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:52px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.35em;color:var(--purple)}
.divider{width:1px;height:20px;background:var(--border)}
.crumb{font-size:11.5px;font-weight:500}
.crumb span{color:var(--muted)}
.nav-links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-btn{font-size:11px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);color:var(--muted);transition:all .15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--purple);color:var(--purple)}
.nav-btn.on{border-color:var(--purple);color:var(--purple);background:rgba(139,124,248,.07)}

.filter-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:11px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0}
.fb-label{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip-group{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);color:var(--muted);transition:all .15s;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{border-color:var(--purple);color:var(--purple);background:rgba(139,124,248,.08)}
.budget-pill{margin-left:auto;font-size:10.5px;padding:5px 12px;border-radius:20px;background:rgba(30,205,181,.07);border:1px solid rgba(30,205,181,.28);color:var(--teal);font-weight:500}

.layout{display:grid;grid-template-columns:480px 1fr;height:calc(100vh - 52px - 50px);overflow:hidden}
.panel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel:last-child{border-right:none}
.panel-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panel-scroll{flex:1;overflow-y:auto;padding:8px}

.tpl-item{padding:11px 13px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .15s;margin-bottom:5px;animation:up .3s ease both}
.tpl-item:hover{background:var(--panel);border-color:var(--border)}
.tpl-item.active{background:rgba(139,124,248,.07);border-color:rgba(139,124,248,.28)}
.tpl-h1{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.tpl-id{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.04em}
.tpl-aud{margin-left:auto;font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:4px}
.tpl-aud.parent{background:rgba(255,122,46,.1);color:var(--orange);border:1px solid rgba(255,122,46,.25)}
.tpl-aud.student{background:rgba(94,168,255,.1);color:var(--blue);border:1px solid rgba(94,168,255,.25)}
.tpl-aud.shared{background:rgba(46,204,154,.1);color:var(--green);border:1px solid rgba(46,204,154,.25)}
.tpl-title{font-size:11.5px;font-weight:500;margin-bottom:5px;line-height:1.35}
.tpl-h2{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{font-size:9px;font-weight:600;padding:2px 6px;border-radius:20px;white-space:nowrap}
.pill.day{background:rgba(139,124,248,.12);color:var(--purple);border:1px solid rgba(139,124,248,.25)}
.pill.tone{background:rgba(46,204,154,.10);color:var(--green);border:1px solid rgba(46,204,154,.22)}
.read-bar{height:3px;background:var(--faint);border-radius:3px;overflow:hidden;margin-top:7px;position:relative}
.read-bar-fill{height:100%;border-radius:3px;transition:width .8s}
.read-label{font-size:8.5px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace}

.detail-wrap{flex:1;overflow-y:auto;padding:20px 24px 40px}
.detail-head{display:flex;align-items:flex-start;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px}
.d-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.d-name{font-size:18px;font-weight:500;margin-bottom:4px;letter-spacing:-.01em}
.d-sub{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.d-pills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.split{display:grid;grid-template-columns:1fr 290px;gap:22px;align-items:start}
.split-main{min-width:0}
.split-side{display:flex;flex-direction:column;gap:14px}

.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.section-title{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}

.body-preview{font-size:12px;line-height:1.65;color:var(--text);white-space:pre-wrap;font-family:'DM Sans',sans-serif}
.body-preview strong{color:var(--text);font-weight:600}
.var{display:inline-block;background:rgba(245,188,30,.13);color:var(--amber);padding:1px 6px;border-radius:4px;font-family:'DM Mono',monospace;font-size:11px;font-weight:500}

.rule-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--faint);font-size:11.5px;line-height:1.5}
.rule-row:last-child{border-bottom:none}
.rule-icon{flex-shrink:0;width:18px;color:var(--green)}
.rule-row strong{color:var(--text)}

.var-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:11px;border-bottom:1px dashed var(--faint);gap:8px}
.var-item:last-child{border-bottom:none}
.var-item code{font-family:'DM Mono',monospace;color:var(--amber);font-size:11px;flex-shrink:0}
.var-item span{color:var(--muted);font-size:10.5px;text-align:right}

.phone{width:260px;border-radius:28px;overflow:hidden;border:7px solid #181830;box-shadow:0 14px 42px rgba(0,0,0,.8);background:#0d1418;margin:0 auto}
.phone-inner{display:flex;flex-direction:column;height:480px}
.wa-hdr{background:#202c33;padding:10px 12px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.wa-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,#FF7A2E,#F5BC1E);flex-shrink:0}
.wa-name{font-size:12px;font-weight:600;color:#e9edef}
.wa-status{font-size:9.5px;color:#8696a0;margin-top:1px}
.wa-msgs{flex:1;overflow-y:auto;padding:8px 9px;background:#0d1418}
.wa-date{text-align:center;margin:4px 0 8px}
.wa-date span{background:#182229;color:#8696a0;font-size:9.5px;padding:3px 9px;border-radius:7px}
.bw{display:flex;margin-bottom:3px}
.bw.in{justify-content:flex-start}
.bubble{max-width:88%;padding:7px 10px 17px;border-radius:8px 8px 8px 2px;font-size:11.5px;line-height:1.55;color:#e9edef;background:#202c33;position:relative;word-break:break-word;animation:slideIn .3s ease both;white-space:pre-wrap}
.bubble strong{color:#fff}
.btime{position:absolute;bottom:3px;right:8px;font-size:8.5px;color:#8696a0}
.wa-header-img{border-radius:4px;margin-bottom:5px;background:linear-gradient(135deg,#FF7A2E,#F5BC1E);height:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:600;text-align:center;padding:8px}
.wa-btn-row{background:#202c33;padding:6px 8px;margin-top:1px;border-radius:2px 2px 8px 8px;display:flex;flex-direction:column;gap:1px}
.wa-btn{background:rgba(255,255,255,.06);color:#53bdeb;padding:7px;text-align:center;font-size:11px;font-weight:500;border-radius:4px}

.regional-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reg-chip{font-size:9.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s}
.reg-chip.on{border-color:var(--orange);color:var(--orange);background:rgba(255,122,46,.08)}
.reg-chip:hover:not(.on){color:var(--text);border-color:var(--muted)}

.pair-banner{background:linear-gradient(135deg,rgba(255,122,46,.06),rgba(94,168,255,.06));border:1px solid rgba(139,124,248,.25);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:14px;align-items:center;font-size:11.5px}
.pair-banner strong{color:var(--text)}
.pair-banner .pair-tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:5px;border:1px solid rgba(139,124,248,.3);color:var(--purple);background:rgba(139,124,248,.08)}
.jump-btn{margin-left:auto;font-size:10.5px;padding:5px 11px;border-radius:7px;border:1px solid var(--border);color:var(--purple)}
.jump-btn:hover{border-color:var(--purple);background:rgba(139,124,248,.06)}

/* AUTO-SELECTOR */
.autosel{background:linear-gradient(135deg,rgba(139,124,248,.06),rgba(30,205,181,.04));border:1px solid rgba(139,124,248,.22);border-radius:14px;padding:18px;margin-top:10px}
.autosel-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-top:14px;margin-bottom:14px}
.as-col{background:var(--faint);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.as-label{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.as-seg{display:flex;gap:3px;background:var(--bg);padding:3px;border-radius:7px}
.as-seg button{flex:1;padding:5px;font-size:10.5px;border-radius:5px;color:var(--muted);transition:all .15s}
.as-seg button.on{background:var(--card);color:var(--purple);font-weight:500}
.as-result{background:rgba(46,204,154,.08);border:1px solid rgba(46,204,154,.25);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-top:6px}
.as-result-ico{font-size:22px}
.as-result-txt{flex:1;font-size:11.5px;line-height:1.5}
.as-result-txt strong{color:var(--green)}

@media (max-width:1100px){
  .layout{grid-template-columns:1fr}
  .panel:first-child{display:none}
  .split{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ═══════════════════════════════════════════════════════
   25-TEMPLATE LIBRARY · audience-split (parent vs student)
   • 10 paired templates × 2 audiences = 20
   • 5 shared templates (audience-neutral) = 5
   • Total = 25 (at WATI cap)
   • T10_HYPE_VIDEO dropped per team's PDF
═══════════════════════════════════════════════════════ */

const TEMPLATES = [

  // ═══ PRE-COHORT ═══════════════════════════════════════
  {
    id:"T11_CURIOSITY_HOOK_PARENT", logical_id:"T11_CURIOSITY_HOOK", audience:"parent",
    name:"Curiosity hook · Parent voice", icon:"🔍", day:"D-2", dayKey:"pre",
    tone:"Warm · invites parent to engage child", group:"Pre-cohort", read:67, color:"#FF7A2E",
    rule:"Fires D-2 · students with grade 5–7",
    body:`Quick question for {{child_first_name}} 👇

*{{hook_question}}*

Encourage them to think — we'll explain this in tomorrow's class 😊`,
    variables:[
      {k:"child_first_name", d:"Student first name"},
      {k:"hook_question", d:"Question tied to D1 topic"},
    ],
  },
  {
    id:"T11_CURIOSITY_HOOK_STUDENT", logical_id:"T11_CURIOSITY_HOOK", audience:"student",
    name:"Curiosity hook · Student voice", icon:"🔍", day:"D-2", dayKey:"pre",
    tone:"Teasing · brain-teaser energy", group:"Pre-cohort", read:71, color:"#5BA8FF",
    rule:"Fires D-2 · students with grade 8–10",
    body:`Quick brain teaser 🧠

*{{hook_question}}*

Think about it — we'll break it tomorrow 😏`,
    variables:[
      {k:"hook_question", d:"Question tied to D1 topic"},
    ],
  },

  // ═══ DAY 0 — WELCOME (regional posters apply to both) ═══
  {
    id:"T01_WELCOME_PARENT", logical_id:"T01_WELCOME", audience:"parent", regional:true,
    name:"Welcome + schedule · Parent voice", icon:"🎉", day:"D0", dayKey:"d0",
    tone:"Trust + safety · long-term framing", group:"Onboarding", read:96, color:"#FF7A2E",
    rule:"Fires on batch_enrollment · grade 5–7 · regional poster auto-selected by state",
    body:`Hello Parent 👋

Welcome to Vedantu's *3-Day Booster Trial for {{child_first_name}}* 🎉

📅 Starting: {{day1_date}} · {{day1_time}}

Your child's schedule:
Day 1 · {{day1_topic}}
Day 2 · {{day2_topic}}
Day 3 · {{day3_topic}}

How to join:
1. Download Vedantu App
2. Login using: {{phone}} / {{email}}
3. Class visible under *My Courses*

👩‍🏫 Teacher: {{teacher_name}} ({{subject}})

We're excited to support {{child_first_name}}'s learning journey 💙`,
    variables:[
      {k:"child_first_name", d:"Student first name"},
      {k:"day1_date", d:"Day 1 date"},
      {k:"day1_time", d:"Day 1 time"},
      {k:"day1_topic", d:"Day 1 topic"},
      {k:"day2_topic", d:"Day 2 topic"},
      {k:"day3_topic", d:"Day 3 topic"},
      {k:"teacher_name", d:"Teacher name"},
      {k:"subject", d:"Subject"},
      {k:"phone", d:"Registered phone (parent's)"},
      {k:"email", d:"Registered email"},
      {k:"header_image", d:"Regional poster URL (auto by state)"},
    ],
  },
  {
    id:"T01_WELCOME_STUDENT", logical_id:"T01_WELCOME", audience:"student", regional:true,
    name:"Welcome + schedule · Student voice", icon:"🎉", day:"D0", dayKey:"d0",
    tone:"Energy + ambition · 'Let's level up'", group:"Onboarding", read:91, color:"#5BA8FF",
    rule:"Fires on batch_enrollment · grade 8–10 · regional poster auto-selected by state",
    body:`Hey {{first_name}}! 🚀

Welcome to your *3-Day {{subject}} Booster Trial*

Starting {{day1_date}} · {{day1_time}}

🔥 Your lineup:
Day 1: {{day1_topic}}
Day 2: {{day2_topic}}
Day 3: {{day3_topic}}

Login → Join → Learn

Teacher: {{teacher_name}}

Let's level up 💪`,
    variables:[
      {k:"first_name", d:"Student first name"},
      {k:"subject", d:"Subject"},
      {k:"day1_date", d:"Day 1 date"},
      {k:"day1_time", d:"Day 1 time"},
      {k:"day1_topic", d:"Day 1 topic"},
      {k:"day2_topic", d:"Day 2 topic"},
      {k:"day3_topic", d:"Day 3 topic"},
      {k:"teacher_name", d:"Teacher"},
      {k:"header_image", d:"Regional poster URL"},
    ],
  },

  // ═══ REMINDERS (SHARED — same body for both audiences) ═══
  {
    id:"T02_REMINDER_T24H", logical_id:"T02_REMINDER_T24H", audience:"shared",
    name:"T-24h class reminder", icon:"⏰", day:"D0–D2 eve", dayKey:"rem24",
    tone:"Anticipation · neutral", group:"Reminder", read:84, color:"#2ECC9A",
    rule:"Fires 24h before each class (D0/D1/D2 eve) · all grades · audience-neutral copy",
    body:`Reminder: {{first_name}}'s class tomorrow ⏰

📘 Topic: {{topic}}
🕡 Time: {{class_time}}

See you in class — consistency builds strong concepts 📚`,
    variables:[
      {k:"first_name", d:"Student first name"},
      {k:"topic", d:"Tomorrow's topic"},
      {k:"class_time", d:"Tomorrow's class time"},
    ],
  },
  {
    id:"T03_REMINDER_T3H", logical_id:"T03_REMINDER_T3H", audience:"shared",
    name:"T-3h reminder + prep", icon:"📚", day:"D1–D3 morn", dayKey:"rem3",
    tone:"Curious · neutral", group:"Reminder", read:88, color:"#2ECC9A",
    rule:"Fires 3h before each Day 1/2/3 class · all grades",
    body:`Class in 3 hours ⏳

{{first_name}}, today's question to think about:
*{{hook_question}}*

Topic: {{topic}}

Be ready with notebook + pen. ✏️`,
    variables:[
      {k:"first_name", d:"Student first name"},
      {k:"hook_question", d:"Question for today"},
      {k:"topic", d:"Today's topic"},
    ],
  },
  {
    id:"T04_JOIN_NOW", logical_id:"T04_JOIN_NOW", audience:"shared",
    name:"Class starts in 30 min · Join CTA", icon:"⚡", day:"D1–D3", dayKey:"join",
    tone:"Urgent · neutral", group:"Reminder", read:92, color:"#2ECC9A",
    rule:"Fires T-30min for each Day 1/2/3 class · all grades",
    body:`Class starts in *30 minutes* ⚡

👉 Join here: {{join_link}}

Log in 5 minutes early for a smooth start.`,
    variables:[
      {k:"join_link", d:"Deep link to class"},
    ],
  },

  // ═══ POST-CLASS — SUMMARY (PAIRED) ═══
  {
    id:"T05_POST_SUMMARY_PARENT", logical_id:"T05_POST_SUMMARY", audience:"parent",
    name:"Post-class summary · Parent", icon:"✨", day:"D1–D3 post", dayKey:"post",
    tone:"Reflective · 'today's class summary'", group:"Post-class", read:81, color:"#FF7A2E",
    rule:"Fires class_ended · attended=YES · grade 5–7",
    body:`Today's class summary 📊

{{child_first_name}} learned:
✅ {{key_takeaway_1}}
✅ {{key_takeaway_2}}
✅ {{key_takeaway_3}}

Feedback: {{feedback_link}}

A performance report will be shared shortly 📧`,
    variables:[
      {k:"child_first_name", d:"Student first name"},
      {k:"key_takeaway_1", d:"Takeaway 1"},
      {k:"key_takeaway_2", d:"Takeaway 2"},
      {k:"key_takeaway_3", d:"Takeaway 3"},
      {k:"feedback_link", d:"Feedback URL"},
    ],
  },
  {
    id:"T05_POST_SUMMARY_STUDENT", logical_id:"T05_POST_SUMMARY", audience:"student",
    name:"Post-class summary · Student", icon:"✨", day:"D1–D3 post", dayKey:"post",
    tone:"Punchy · 'That was solid 💯'", group:"Post-class", read:84, color:"#5BA8FF",
    rule:"Fires class_ended · attended=YES · grade 8–10",
    body:`That was solid 💯

Today you learned:
✅ {{key_takeaway_1}}
✅ {{key_takeaway_2}}
✅ {{key_takeaway_3}}

How was it?
👉 {{feedback_link}}`,
    variables:[
      {k:"key_takeaway_1", d:"Takeaway 1"},
      {k:"key_takeaway_2", d:"Takeaway 2"},
      {k:"key_takeaway_3", d:"Takeaway 3"},
      {k:"feedback_link", d:"Feedback URL"},
    ],
  },

  // ═══ HOMEWORK (SHARED — short, factual) ═══
  {
    id:"T06_HW_ASSIGNED", logical_id:"T06_HW_ASSIGNED", audience:"shared",
    name:"Homework assigned", icon:"✏️", day:"D1–D3", dayKey:"hw",
    tone:"Coach · neutral", group:"Homework", read:78, color:"#2ECC9A",
    rule:"Fires 30 min after class_ended (D1/D2/D3) · attendees only",
    body:`Day {{day_num}} Homework assigned 📚

⏱ {{hw_duration}}
Deadline: {{hw_deadline}}

👉 Start here: {{hw_link}}

Students who complete homework regularly show *3× improvement* in concept clarity.`,
    variables:[
      {k:"day_num", d:"'1' / '2' / '3'"},
      {k:"hw_duration", d:"Estimated time (e.g. '20–25 mins')"},
      {k:"hw_deadline", d:"Deadline timestamp"},
      {k:"hw_link", d:"Homework URL"},
    ],
  },
  {
    id:"T07_HW_REMINDER", logical_id:"T07_HW_REMINDER", audience:"shared",
    name:"HW reminder · unsubmitted", icon:"🔔", day:"D1–D3 eve", dayKey:"hwrem",
    tone:"Nudge · neutral", group:"Homework", read:69, color:"#2ECC9A",
    rule:"Fires T-6h before HW deadline · IF hw_submitted=NO",
    body:`Homework still pending 👀

{{first_name}}, just 20 minutes can lock in today's learning.

👉 Submit here: {{hw_link}}

Even 5 questions beats 0.`,
    variables:[
      {k:"first_name", d:"Student first name"},
      {k:"hw_link", d:"Homework URL"},
    ],
  },

  // ═══ DAILY PERFORMANCE (PAIRED) ═══
  {
    id:"T08_PERF_HIGH_PARENT", logical_id:"T08_PERF_HIGH", audience:"parent",
    name:"Daily perf · High · Parent", icon:"🏆", day:"D1–D2 eve", dayKey:"perfH",
    tone:"Reassuring · 'long-term confidence'", group:"Performance", read:79, color:"#FF7A2E",
    rule:"Fires D1/D2 eve · attended=YES AND hw_submitted=YES · grade 5–7",
    body:`Great progress! 🎉

📊 {{child_first_name}}'s performance:
Attendance: {{attn_score}}%
Homework: Completed
Batch rank: Top {{rank_in_batch}}%

Consistency like this builds long-term academic confidence 💪`,

/* ═══════════════════════════════════════════════════════
   AUTO-SELECTOR — phase + grade → resolved WATI template
═══════════════════════════════════════════════════════ */

function getAudience(grade) {
  if (grade >= 5 && grade <= 7) return "parent";
  if (grade >= 8 && grade <= 10) return "student";
  return "student";
}

function pickLogicalTemplate(state) {
  const {phase, attended_d1, attended_d2, attended_d3, hw_d1, hw_d2, hw_d3, intent} = state;
  if (phase === "pre")        return {id:"T11_CURIOSITY_HOOK", reason:"Pre-cohort · curiosity hook"};
  if (phase === "enroll")     return {id:"T01_WELCOME", reason:"Batch enrollment event"};
  if (phase === "t24h")       return {id:"T02_REMINDER_T24H", reason:"24h before next class"};
  if (phase === "t3h")        return {id:"T03_REMINDER_T3H", reason:"3h before class"};
  if (phase === "t30m")       return {id:"T04_JOIN_NOW", reason:"30 min before class"};
  if (phase === "post_d1") {
    if (!attended_d1) return {id:"T16_D1_NOSHOW", reason:"D1 no-show · empathy re-engage"};
    return {id:"T05_POST_SUMMARY", reason:"D1 attended · summary"};
  }
  if (phase === "hw_d1")      return attended_d1 ? {id:"T06_HW_ASSIGNED", reason:"D1 attended · HW"} : {id:null, reason:"Skipped — D1 not attended"};
  if (phase === "eve_d1")     return (attended_d1 && hw_d1) ? {id:"T08_PERF_HIGH", reason:"D1: attn + HW ✓"} : {id:"T09_PERF_LOW", reason:"D1: partial engagement"};
  if (phase === "post_d2")    return attended_d2 ? {id:"T05_POST_SUMMARY", reason:"D2 attended · summary"} : {id:null, reason:"Skipped — D2 not attended"};
  if (phase === "eve_d2")     return (attended_d2 && hw_d2) ? {id:"T08_PERF_HIGH", reason:"D2: attn + HW ✓"} : {id:"T09_PERF_LOW", reason:"D2: partial engagement"};
  if (phase === "post_d3")    return attended_d3 ? {id:"T05_POST_SUMMARY", reason:"D3 attended · summary"} : {id:null, reason:"Skipped — D3 not attended"};
  if (phase === "end_d3")     return {id:"T12_D3_SUMMARY", reason:"D3 end · transformation close"};
  if (phase === "intent")     return {id:"T13_INTENT_CAPTURE", reason:"D3+1 · ask intent"};
  if (phase === "intent_y")   return {id:"T14_COUNSELLOR_CONNECT", reason:"Reply YES · handoff"};
  if (phase === "intent_n")   return {id:"T15_NURTURE_SOFT", reason:"Reply NO / no reply · soft nurture"};
  return {id:null, reason:"No template"};
}

function resolveTemplate(logical_id, audience) {
  if (!logical_id) return null;
  const candidates = TEMPLATES.filter(t => t.logical_id === logical_id);
  // Shared first (audience-neutral wins for shared messages)
  const shared = candidates.find(t => t.audience === "shared");
  if (shared) return shared.id;
  const match = candidates.find(t => t.audience === audience);
  return match?.id || null;
}

function autoSelect(state, grade) {
  const audience = getAudience(grade);
  const {id: logical, reason} = pickLogicalTemplate(state);
  const watiId = resolveTemplate(logical, audience);
  return {logical_id: logical, wati_id: watiId, audience, reason};
}

    header_image:`[${S.selectedRegion} POSTER]`,
  };

  const rendered = tpl.body.replace(/\{\{(\w+)\}\}/g, (_, k) => sample[k] || `{{${k}}}`);
  const formatted = rendered.replace(/\*(.*?)\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
  const regionColor = REGIONS.find(r => r.code === S.selectedRegion)?.color || "#FF7A2E";

  return `<div class="phone"><div class="phone-inner">
    <div class="wa-hdr">
      <div class="wa-av">V</div>
      <div style="flex:1;min-width:0">
        <div class="wa-name">Vedantu Booster</div>
        <div class="wa-status">online</div>
      </div>
      <div style="color:#8696a0;font-size:13px">⋮</div>
    </div>
    <div class="wa-msgs">
      <div class="wa-date"><span>Today</span></div>
      <div class="bw in">
        <div class="bubble">
          ${tpl.regional ? `<div class="wa-header-img" style="background:linear-gradient(135deg,${regionColor},#FF7A2E)">${S.selectedRegion} · Booster Poster</div>` : ""}
          ${formatted}
          <span class="btime">${new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</span>
        </div>
      </div>
      ${tpl.buttons ? `<div class="bw in" style="margin-top:-2px"><div class="wa-btn-row" style="max-width:88%">${tpl.buttons.map(b => `<div class="wa-btn">${b}</div>`).join("")}</div></div>` : ""}
    </div>
  </div></div>`;
}

function rAutoSelector() {
  const result = autoSelect(S.autosel, S.autosel.grade);
  const match = result.wati_id ? TEMPLATES.find(t => t.id === result.wati_id) : null;

  return `<div class="autosel">
    <div class="section-title" style="margin:0;color:var(--purple)">
      <span>⚡ Auto-selector playground</span>
      <span style="color:var(--muted);text-transform:none;letter-spacing:0;font-size:10px;font-weight:500">grade → audience → template</span>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5">
      Simulate phase + grade — see which WATI template the engine picks (audience routed automatically: 5–7 → parent voice, 8–10 → student voice).
    </div>
    <div class="autosel-grid">
      <div class="as-col">
        <div class="as-label">Journey phase</div>
        <select class="as-phase" style="width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:11px">
          ${[
            ["pre","Pre-cohort"],["enroll","On enrollment"],
            ["t24h","T-24h reminder"],["t3h","T-3h reminder"],["t30m","T-30m join CTA"],
            ["post_d1","After D1 class"],["hw_d1","D1 HW assigned"],["eve_d1","D1 evening"],
            ["post_d2","After D2 class"],["eve_d2","D2 evening"],
            ["post_d3","After D3 class"],["end_d3","D3 end summary"],
            ["intent","D3+1 intent ask"],["intent_y","Reply YES"],["intent_n","No reply / NO"],
          ].map(([v,l]) => `<option value="${v}" ${S.autosel.phase===v?"selected":""}>${l}</option>`).join("")}
        </select>
      </div>
      <div class="as-col">
        <div class="as-label">Grade (audience)</div>
        <select class="as-grade" style="width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:11px">
          ${[5,6,7,8,9,10].map(g => `<option value="${g}" ${S.autosel.grade===g?"selected":""}>Grade ${g} · ${getAudience(g)}</option>`).join("")}
        </select>
      </div>
      <div class="as-col">
        <div class="as-label">Attended D1 / D2 / D3</div>
        <div class="as-seg" style="margin-bottom:4px">
          <button class="${S.autosel.attended_d1?"on":""}" data-as="attended_d1" data-val="1">D1 ✓</button>
          <button class="${!S.autosel.attended_d1?"on":""}" data-as="attended_d1" data-val="0">D1 ✗</button>
        </div>
        <div class="as-seg" style="margin-bottom:4px">
          <button class="${S.autosel.attended_d2?"on":""}" data-as="attended_d2" data-val="1">D2 ✓</button>
          <button class="${!S.autosel.attended_d2?"on":""}" data-as="attended_d2" data-val="0">D2 ✗</button>
        </div>
        <div class="as-seg">
          <button class="${S.autosel.attended_d3?"on":""}" data-as="attended_d3" data-val="1">D3 ✓</button>
          <button class="${!S.autosel.attended_d3?"on":""}" data-as="attended_d3" data-val="0">D3 ✗</button>
        </div>
      </div>
      <div class="as-col">
        <div class="as-label">HW D1 / D2</div>
        <div class="as-seg" style="margin-bottom:4px">
          <button class="${S.autosel.hw_d1?"on":""}" data-as="hw_d1" data-val="1">HW1 ✓</button>
          <button class="${!S.autosel.hw_d1?"on":""}" data-as="hw_d1" data-val="0">HW1 ✗</button>
        </div>
        <div class="as-seg">
          <button class="${S.autosel.hw_d2?"on":""}" data-as="hw_d2" data-val="1">HW2 ✓</button>
          <button class="${!S.autosel.hw_d2?"on":""}" data-as="hw_d2" data-val="0">HW2 ✗</button>
        </div>
      </div>
    </div>
    <div class="as-result">
      <div class="as-result-ico">${match?.icon || "📩"}</div>
      <div class="as-result-txt">
        Logical → <strong>${result.logical_id || "—"}</strong> · Audience → <strong>${result.audience}</strong><br>
        WATI ID → <strong>${result.wati_id || "(no template — phase skipped)"}</strong><br>
        <span style="color:var(--muted)">Reason: ${result.reason}</span>
      </div>
      ${result.wati_id ? `<button class="jump-btn" data-jump="${result.wati_id}">View →</button>` : ""}
    </div>
  </div>`;
}

function highlightVars(body) {
  return body
    .replace(/\{\{(\w+)\}\}/g, '<span class="var">{{$1}}</span>')
    .replace(/\*(.*?)\*/g, '<strong>$1</strong>');
}

/* ═══════════════════════════════════════════════════════
   HANDLERS
═══════════════════════════════════════════════════════ */

function bindHandlers() {
  document.querySelectorAll("[data-day]").forEach(el => {
    el.addEventListener("click", () => { S.filterDay = el.dataset.day; render(); });
  });
  document.querySelectorAll("[data-aud]").forEach(el => {
    el.addEventListener("click", () => { S.filterAudience = el.dataset.aud; render(); });
  });
  document.querySelectorAll("[data-tid]").forEach(el => {
    el.addEventListener("click", () => { S.selectedId = el.dataset.tid; render(); });
  });
  document.querySelectorAll("[data-region]").forEach(el => {
    el.addEventListener("click", () => { S.selectedRegion = el.dataset.region; render(); });
  });

  document.querySelector(".as-phase")?.addEventListener("change", e => {
    S.autosel.phase = e.target.value; render();
  });
  document.querySelector(".as-grade")?.addEventListener("change", e => {
    S.autosel.grade = +e.target.value; render();
  });
  document.querySelectorAll("[data-as]").forEach(el => {
    el.addEventListener("click", () => {
      S.autosel[el.dataset.as] = el.dataset.val === "1";
      render();
    });
  });
  document.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => { S.selectedId = el.dataset.jump; render(); });
  });
}

render();
</script>
</body>
</html>
