<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VED AI — Booster CLM Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060C18;--panel:#0B1525;--card:#0F1D30;--border:#162438;
  --purple:#8B7CF8;--teal:#1ECDB5;--green:#2ECC9A;--amber:#F5BC1E;
  --red:#F06060;--blue:#5BA8FF;--pink:#E06EAA;--orange:#FF7A2E;
  --text:#C8DCF0;--muted:#4A6580;--faint:#0E1B2C;
}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes grow{from{width:0}to{width:var(--w)}}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;
  height:52px;padding:0 28px;
  background:var(--bg);border-bottom:1px solid var(--border);
}
.logo{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.35em;color:var(--purple);white-space:nowrap}
.divider{width:1px;height:20px;background:var(--border)}
.crumb{font-size:11.5px;font-weight:500;color:var(--text);letter-spacing:.02em}
.crumb span{color:var(--muted)}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-btn{font-size:11px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);color:var(--muted);transition:all .15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--purple);color:var(--purple)}
.nav-btn.on{border-color:var(--purple);color:var(--purple);background:rgba(139,124,248,.07)}

/* ── COHORT BAR ── */
.cohort-bar{
  background:var(--panel);border-bottom:1px solid var(--border);
  padding:12px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
}
.cb-label{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cohort-pill{
  display:inline-flex;align-items:center;gap:9px;
  padding:6px 14px;border-radius:22px;
  background:rgba(139,124,248,.07);border:1px solid rgba(139,124,248,.28);
  font-size:12px;font-weight:500;
}
.cohort-pill strong{color:var(--purple)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s ease infinite;box-shadow:0 0 6px var(--green)}
.cohort-phase{
  display:flex;gap:4px;background:var(--faint);padding:3px;border-radius:8px;border:1px solid var(--border);
}
.cp-dot{padding:4px 14px;border-radius:6px;font-size:10.5px;font-weight:500;color:var(--muted);position:relative}
.cp-dot.done{color:var(--green)}
.cp-dot.active{background:var(--card);color:var(--purple)}
.batch-select{font-size:11.5px;padding:5px 11px;border-radius:7px;border:1px solid var(--border);color:var(--text);background:var(--faint);margin-left:auto}

/* ── LAYOUT ── */
.wrap{max-width:1480px;margin:0 auto;padding:22px 28px 60px}
h1.pg-title{font-size:26px;font-weight:300;letter-spacing:-.01em;margin-bottom:3px;animation:up .4s ease}
.pg-sub{font-size:12px;color:var(--muted);margin-bottom:22px}

/* ── KPI STRIP ── */
.kpi-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;
}
.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;position:relative;overflow:hidden;animation:up .4s ease both;
}
.kpi-label{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.kpi-val{font-size:26px;font-weight:500;line-height:1;letter-spacing:-.01em}
.kpi-val .suffix{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.kpi-sub{font-size:10.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:4px}
.delta{font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}
.delta.up{background:rgba(46,204,154,.1);color:var(--green)}
.delta.down{background:rgba(240,96,96,.1);color:var(--red)}
.delta.flat{background:rgba(139,124,248,.1);color:var(--purple)}

/* ── SECTION ── */
.section{margin-bottom:24px;animation:up .5s ease both}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sec-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec-count{font-size:10px;color:var(--muted);padding:2px 8px;border-radius:10px;background:var(--faint);border:1px solid var(--border)}

/* ── FUNNEL ── */
.funnel-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.funnel-row{display:grid;grid-template-columns:160px 1fr 100px 70px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--faint)}
.funnel-row:last-child{border-bottom:none}
.funnel-label{font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.funnel-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.funnel-bar{height:22px;background:var(--faint);border-radius:6px;overflow:hidden;position:relative}
.funnel-fill{height:100%;border-radius:6px;position:relative;animation:grow 1.2s cubic-bezier(.4,0,.2,1) forwards}
.funnel-fill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.08) 50%,transparent 100%);
}
.funnel-n{font-size:14px;font-weight:500;font-family:'DM Mono',monospace;text-align:right}
.funnel-pct{font-size:11px;color:var(--muted);text-align:right;font-family:'DM Mono',monospace}

/* ── TWO COL ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;min-height:240px}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.col-title{font-size:12.5px;font-weight:500}
.col-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* ── TIER ROWS ── */
.tier-row{
  display:grid;grid-template-columns:130px 1fr 70px;gap:12px;align-items:center;
  padding:9px 10px;border-radius:8px;margin-bottom:4px;transition:all .15s;
}
.tier-row:hover{background:var(--faint)}
.tier-badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500}
.tier-dot{width:10px;height:10px;border-radius:50%}
.tier-bar{height:8px;background:var(--faint);border-radius:99px;overflow:hidden}
.tier-fill{height:100%;border-radius:99px;animation:grow 1.1s cubic-bezier(.4,0,.2,1) forwards}
.tier-n{font-size:13px;font-weight:500;font-family:'DM Mono',monospace;text-align:right}

/* ── REGIONS ── */
.region-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.region-card{
  background:var(--faint);border:1px solid var(--border);border-radius:10px;
  padding:12px 13px;position:relative;transition:all .15s;cursor:pointer;
}
.region-card:hover{border-color:var(--purple);transform:translateY(-1px)}
.region-flag{font-size:18px;margin-bottom:6px}
.region-name{font-size:11.5px;font-weight:500;margin-bottom:3px}
.region-code{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.09em;margin-bottom:10px}
.region-metric{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.region-mval{font-size:13px;font-weight:500;font-family:'DM Mono',monospace}
.region-mlabel{font-size:9px;color:var(--muted)}
.region-bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}
.region-bfill{height:100%;border-radius:4px}

/* ── TEMPLATE LEADERBOARD ── */
.tpl-row{
  display:grid;grid-template-columns:30px 1fr 80px 90px;gap:11px;align-items:center;
  padding:8px 10px;border-radius:7px;margin-bottom:3px;font-size:11.5px;
}
.tpl-row:hover{background:var(--faint)}
.tpl-rank{width:22px;height:22px;border-radius:6px;background:var(--faint);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted)}
.tpl-rank.top{background:rgba(245,188,30,.14);color:var(--amber)}
.tpl-name{font-weight:500}
.tpl-meta{font-size:9.5px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.tpl-rate{font-size:12px;font-weight:500;font-family:'DM Mono',monospace;text-align:right}
.tpl-rate.good{color:var(--green)}
.tpl-rate.mid{color:var(--amber)}
.tpl-rate.low{color:var(--red)}

/* ── ACTIVITY FEED ── */
.feed-row{
  display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed var(--faint);
  animation:slideIn .3s ease both;
}
.feed-row:last-child{border-bottom:none}
.feed-icon{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.feed-body{flex:1;min-width:0}
.feed-text{font-size:11.5px;line-height:1.5}
.feed-text strong{color:var(--text);font-weight:500}
.feed-meta{font-size:10px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}

/* ── SALES HANDOFF ── */
.handoff-table{width:100%;border-collapse:collapse;font-size:11.5px}
.handoff-table th{
  text-align:left;padding:8px 10px;font-size:9.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--border);
}
.handoff-table td{padding:10px;border-bottom:1px dashed var(--faint)}
.handoff-table tr:hover td{background:var(--faint)}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-block}
.score-chip{font-family:'DM Mono',monospace;font-size:11.5px;font-weight:500}
.handoff-btn{font-size:10.5px;padding:5px 11px;border-radius:6px;border:1px solid var(--border);color:var(--text);transition:all .15s}
.handoff-btn:hover{border-color:var(--green);color:var(--green);background:rgba(46,204,154,.07)}

/* ── FOOTNOTE ── */
.foot-note{
  margin-top:28px;padding:12px 16px;background:var(--faint);border:1px dashed var(--border);
  border-radius:10px;font-size:11px;color:var(--muted);line-height:1.6;
}
.foot-note strong{color:var(--text)}

/* responsive */
@media (max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .region-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  .wrap{padding:16px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .region-grid{grid-template-columns:1fr 1fr}
  .funnel-row{grid-template-columns:100px 1fr 70px}
  .funnel-pct{display:none}
}
</style>
</head>

function render() {

function rCohortBar() {

  const order = phases.findIndex(p => p.k === COHORT.phase);
  return `<div class="cohort-bar">
    <span class="cb-label">Active Cohort</span>
    <div class="cohort-pill">
      <span class="live-dot"></span>
      <strong>${COHORT.id}</strong>
      <span style="color:var(--muted)">·</span>
      <span>${COHORT.start} → ${COHORT.end}</span>
    </div>
    <div class="cohort-phase">
      ${phases.map((p,i) => {
        const cls = i < order ? "done" : i === order ? "active" : "";
        return `<div class="cp-dot ${cls}">${p.label}</div>`;
      }).join("")}
    </div>
    <select class="batch-select">
      <option>${COHORT.id}</option>
      <option>BOOSTER-APR-C16 (ended)</option>
      <option>BOOSTER-APR-C15 (ended)</option>
      <option>BOOSTER-MAY-C18 (upcoming)</option>
    </select>
  </div>`;
}

function rKPIStrip() {
  return `<div class="kpi-grid">
    ${KPIS.map((k,i) => `
      <div class="kpi" style="animation-delay:${i*.05}s">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-val">${k.val}<span class="suffix">${k.suffix||""}</span></div>
        <div class="kpi-sub">
          ${k.sub}
          ${k.delta ? `<span class="delta ${k.dtype}">${k.delta}${k.note?" · "+k.note:""}</span>` : ""}
        </div>
      </div>`).join("")}
  </div>`;
}

function rFunnel() {
  const max = FUNNEL[0].n;
  return `<div class="funnel-card">
    ${FUNNEL.map((f,i) => {
      const pct = ((f.n/max)*100).toFixed(1);
      const opacity = f.pending ? .55 : 1;
      return `<div class="funnel-row" style="opacity:${opacity}">
        <div class="funnel-label">
          <span class="funnel-icon" style="background:${f.color}15;color:${f.color}">${f.icon}</span>
          ${f.label}
        </div>
        <div class="funnel-bar">
          <div class="funnel-fill" style="--w:${pct}%;width:${pct}%;background:linear-gradient(90deg,${f.color}cc,${f.color}66)"></div>
        </div>
        <div class="funnel-n">${f.n.toLocaleString()}</div>
        <div class="funnel-pct">${pct}%</div>
      </div>`;
    }).join("")}
  </div>`;
}

function rLeadTiers() {
  return `<div class="col-card">
    <div class="col-head">
      <div>
        <div class="col-title">Lead Tier Distribution</div>
        <div class="col-sub">Live tier assignment · updated nightly</div>
      </div>
      <span class="sec-count">${TIER_TOTAL.toLocaleString()} scored</span>
    </div>
    ${TIERS.map(t => {
      const pct = ((t.n/TIER_TOTAL)*100).toFixed(1);
      return `<div class="tier-row">
        <div class="tier-badge">
          <span class="tier-dot" style="background:${t.color}"></span>
          ${t.label}
        </div>
        <div>
          <div class="tier-bar"><div class="tier-fill" style="--w:${pct}%;width:${pct}%;background:${t.color}"></div></div>
          <div style="font-size:9.5px;color:var(--muted);margin-top:4px">${t.note} · score ${t.range}</div>
        </div>
        <div class="tier-n" style="color:${t.color}">${t.n}</div>
      </div>`;
    }).join("")}
  </div>`;
}

function rTemplateBoard() {
  return `<div class="col-card">
    <div class="col-head">
      <div>
        <div class="col-title">Template Performance</div>
        <div class="col-sub">WhatsApp read rate · top 8 templates</div>
      </div>
      <a href="templates.html" style="font-size:10.5px;color:var(--purple)">View all →</a>
    </div>
    ${TEMPLATES_PERF.map(t => {
      const rateCls = t.read >= 80 ? "good" : t.read >= 60 ? "mid" : "low";
      const rankCls = t.rank <= 3 ? "top" : "";
      return `<div class="tpl-row">
        <div class="tpl-rank ${rankCls}">${t.rank}</div>
        <div>
          <div class="tpl-name">${t.name}</div>
          <div class="tpl-meta">${t.id} · ${t.day}</div>
        </div>
        <div class="tpl-rate ${rateCls}">${t.read}%</div>
        <div style="font-size:10px;color:var(--muted);text-align:right">read rate</div>
      </div>`;
    }).join("")}
  </div>`;
}

function rRegions() {
  const maxEnr = Math.max(...REGIONS.map(r => r.enrolled));
  return `<div class="region-grid">
    ${REGIONS.map(r => {
      const rate = ((r.attended/r.enrolled)*100).toFixed(0);
      const wPct = (r.enrolled/maxEnr)*100;
      return `<div class="region-card">
        <div class="region-flag">${r.flag}</div>
        <div class="region-name">${r.name}</div>
        <div class="region-code">STATE · ${r.code}</div>
        <div class="region-metric">
          <span class="region-mval">${r.enrolled}</span>
          <span class="region-mlabel">enrolled</span>
        </div>
        <div class="region-metric">
          <span class="region-mval" style="color:${r.color}">${rate}%</span>
          <span class="region-mlabel">D2 attn</span>
        </div>
        <div class="region-bar"><div class="region-bfill" style="width:${wPct}%;background:${r.color}"></div></div>
      </div>`;
    }).join("")}
  </div>`;
}

function rSalesHandoff() {
  const tierColor = {hot:"#F06060", warm75:"#FF7A2E", warm50:"#F5BC1E"};
  const tierLabel = {hot:"Hot", warm75:"Warm-75", warm50:"Warm-50"};
  return `<div class="col-card">
    <div class="col-head">
      <div>
        <div class="col-title">Sales Handoff Queue</div>
        <div class="col-sub">Top 8 by score · click to connect counsellor</div>
      </div>
      <a href="leads.html" style="font-size:10.5px;color:var(--purple)">Full queue →</a>
    </div>
    <table class="handoff-table">
      <thead><tr>
        <th>Student</th><th>Reg</th><th>Score</th><th>Tier</th><th></th>
      </tr></thead>
      <tbody>
        ${SALES_QUEUE.map(s => {
          const c = tierColor[s.tier];
          return `<tr>
            <td>
              <div style="font-weight:500">${s.name}</div>
              <div style="font-size:9.5px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px">${s.reason}</div>
            </td>
            <td style="color:var(--muted);font-family:'DM Mono',monospace">${s.region}</td>
            <td><span class="score-chip" style="color:${c}">${s.score.toFixed(2)}</span></td>
            <td><span class="pill" style="background:${c}18;color:${c};border:1px solid ${c}35">${tierLabel[s.tier]}</span></td>
            <td><button class="handoff-btn">Handoff →</button></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  </div>`;
}

function rActivity() {
  return `<div class="col-card">
    <div class="col-head">
      <div>
        <div class="col-title">Live Activity Feed</div>
        <div class="col-sub">Triggers fired · jobs · handoffs · alerts</div>
      </div>
      <span style="font-size:10px;color:var(--green);display:inline-flex;align-items:center;gap:5px">
        <span class="live-dot"></span>Live
      </span>
    </div>
    ${ACTIVITY.map((a,i) => `
      <div class="feed-row" style="animation-delay:${i*.06}s">
        <div class="feed-icon" style="background:${a.color}15;color:${a.color}">${a.icon}</div>
        <div class="feed-body">
          <div class="feed-text">${a.msg}</div>
          <div class="feed-meta">${a.meta}</div>
        </div>
      </div>`).join("")}
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   HANDLERS
═══════════════════════════════════════════════════════ */

function bindHandlers() {
  document.querySelectorAll(".region-card").forEach(el => {
    el.addEventListener("click", () => {
      el.style.borderColor = "var(--purple)";
      setTimeout(() => el.style.borderColor = "", 600);
    });
  });

  document.querySelectorAll(".handoff-btn").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      el.textContent = "✓ Queued";
      el.style.borderColor = "var(--green)";
      el.style.color = "var(--green)";
      el.style.background = "rgba(46,204,154,.1)";
    });
  });
}

/* ── BOOT ── */
render();
</script>
</body>
</html>
